<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="1; url=../jay2/">
<link rel="canonical" href="../jay2/">
<title>Jay App</title>
<style>body{font:15px/1.5 -apple-system,system-ui,sans-serif;margin:0;padding:40px 20px;text-align:center;background:#f3f4f8;color:#14181f}@media (prefers-color-scheme:dark){body{background:#0c0f14;color:#e8ebf0}}a{color:#5b4ef0}</style>
<script>
/* Stari Jay HL Screener je nadomeščen z Jay App (../jay2/). Odjavi stari service worker in njegov cache, nato preusmeri. */
(function(){var go=function(){location.replace('../jay2/'+location.search+location.hash)};
  try{if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){if(/\/jay\/$/.test(r.scope))r.unregister()})}).catch(function(){})}catch(e){}
  try{if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){if(k.indexOf('jayhl-')===0)caches.delete(k)})}).catch(function(){})}catch(e){}
  setTimeout(go,150)})();
</script>
</head>
<body>
<p>Jay HL Screener se je preselil v <b>Jay App</b>.</p>
<p><a href="../jay2/">Odpri Jay App →</a></p>
</body>
</html>
