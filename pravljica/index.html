<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2A1A0C"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Inja in Eva"><meta name="description" content="Jesenska pravljica o Inji in Evi."><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><script>window.__PRAVLJICA_APP__=true</script><title>Inja in Eva in zlati list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: one book page per screen — illustration on top, story text on a paper card below, leaf dots as page counter */
:root{
  --bg:#F6EEDF; --paper:#FFFBF2; --ink:#3A2A1C; --soft:#7A6450; --gold:#D98A1B; --leaf:#B9541F; --line:#E7D8BF; --shade:rgba(58,42,28,.12);
  --display:"Baloo 2",ui-rounded,"Trebuchet MS",sans-serif; --body:"Andika","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17130F;--paper:#221C16;--ink:#F3E6D0;--soft:#BFA889;--gold:#F0A93A;--leaf:#E07A3F;--line:#3A3027;--shade:rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130F;--paper:#221C16;--ink:#F3E6D0;--soft:#BFA889;--gold:#F0A93A;--leaf:#E07A3F;--line:#3A3027;--shade:rgba(0,0,0,.4);color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0}
.book{max-width:760px;margin:0 auto;padding-block:16px 24px;padding-inline:16px;display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{white-space:nowrap;font-family:var(--display);font-weight:800;font-size:18px;color:var(--leaf);letter-spacing:.01em}
.dots{display:flex;gap:2px;justify-content:flex-end}
.dots button{width:18px;height:22px;padding:0;border:0;background:none;cursor:pointer;color:var(--line)}
.dots button[aria-current="true"]{color:var(--gold)}
.dots svg{width:100%;height:100%;display:block}
.stage{position:relative;border-radius:22px;overflow:hidden;background:var(--paper);box-shadow:0 10px 30px var(--shade);aspect-ratio:3/2;max-width:100%}
.stage img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .35s ease}
.stage .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--soft);font-size:15px;padding:16px;text-align:center}
.cover-title{position:absolute;left:0;right:0;top:0;padding:18px 20px 40px;text-align:center;background:linear-gradient(rgba(20,12,4,.55),rgba(20,12,4,0));color:#FFF6E2;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.cover-title h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,52px);line-height:1;margin:0;text-wrap:balance}
.cover-title p{margin:6px 0 0;font-size:clamp(13px,3.2vw,17px);opacity:.92}
.text{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 20px;font-size:clamp(19px,4.6vw,23px);line-height:1.55;min-height:7.5em}
.text p{margin:0;max-width:62ch}
.text .num{display:block;font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf);margin-bottom:6px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nav button{font-family:var(--display);font-weight:800;font-size:19px;border-radius:16px;padding:12px 10px;cursor:pointer;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.nav button.next{background:var(--gold);border-color:var(--gold);color:#2A1A08}
.nav button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.end{text-align:center}
.end h2{font-family:var(--display);font-weight:800;font-size:34px;margin:0;color:var(--leaf)}
.fade img{opacity:0}
@media (prefers-reduced-motion: reduce){.stage img{transition:none}}
</style>

</head><body><div class="book" id="book">
  <div class="top"><span class="brand">Inja in Eva</span><nav class="dots" id="dots" aria-label="Strani"></nav></div>
  <div class="stage" id="stage"></div>
  <div class="text" id="text" aria-live="polite"></div>
  <div class="nav"><button type="button" id="prev">Nazaj</button><button type="button" class="next" id="next">Naprej</button></div>
</div>

<script>window.__PHOTOS={"cover": "ex/cover.webp", "p1": "ex/p1.webp", "p2": "ex/p2.webp", "p3": "ex/p3.webp", "p4": "ex/p4.webp", "p5": "ex/p5.webp", "p6": "ex/p6.webp", "p7": "ex/p7.webp", "p8": "ex/p8.webp"};</script>
<script>
const IMG=window.__PHOTOS||{};
const PAGES=[
 {id:"cover",t:"Jesenska pravljica o dveh sestrah, zlatem listu in najstarejšem hrastu v gozdu. Obrni stran in začniva."},
 {id:"p1",t:"Bilo je jesensko jutro in gozd za hišo je bil rumen, rdeč in oranžen. »Danes greva na pravo pustolovščino,« je rekla Inja in si zavezala škornje. Eva je stisnila svojega plišastega zajčka in se nasmejala do ušes."},
 {id:"p2",t:"Pod velikim kostanjem je Eva zagledala list, ki se je svetil kot sonce. Ko ga je pobrala, je tiho zašepetal: »Izgubil sem se. Pomagajta mi domov, na vrh najstarejšega hrasta v gozdu.« Sestri sta se spogledali. »Seveda ti pomagava!«"},
 {id:"p3",t:"Pot ju je pripeljala do potoka. Na kamnu je sedela veverica s košatim repom. »Jaz sem Lešnik,« je rekla. »Skačita za mano, kamen za kamnom!« Inja je prijela Evo za roko in čez sta prišli, ne da bi si zmočili nogavice."},
 {id:"p4",t:"Globlje v gozdu je postalo temneje in Eva se je ustrašila. Inja jo je objela in zapela njuno pesmico. In glej, gobice ob poti so ena za drugo zasvetile kot majhne lučke in jima pokazale pot."},
 {id:"p5",t:"Na jasi sta srečali ježka, ki mu je jabolko obtičalo na bodicah. Eva ga je nežno pobožala, Inja pa je previdno potegnila jabolko dol. »Hvala!« je zavriskal ježek in se jima pridružil."},
 {id:"p6",t:"Končno so prišli do najstarejšega hrasta. Bil je tako visok, da se mu ni videlo vrha. »Previsoko je,« je zavzdihnila Eva. »Ne, če sva skupaj!« je rekla Inja. Dvignila je Evo na ramena, Lešnik pa je nesel list po deblu čisto do vrha."},
 {id:"p7",t:"Ko se je zlati list vrnil na svojo vejo, je zažarelo celo drevo. Z neba je začelo deževati zlato listje kot topel sneg. Ježek je plesal, Lešnik je skakal, Inja in Eva pa sta se vrteli in smejali."},
 {id:"p8",t:"Zvečer sta bili sestri že pod odejo. Na oknu se je svetil majhen zlat list, darilo starega hrasta. »Veš, kaj je najboljše pri pustolovščinah?« je zašepetala Eva. »Da sva skupaj,« je rekla Inja. Lahko noč, Inja. Lahko noč, Eva."},
 {id:"end"}
];
const LEAF='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2c4 3 7 6.5 7 10.5A7 7 0 0 1 12.8 19v3h-1.6v-3A7 7 0 0 1 5 12.5C5 8.5 8 5 12 2z"/></svg>';
let cur=0;try{const s=+localStorage.getItem("ie-page");if(s>=0&&s<PAGES.length)cur=s;}catch(e){}
const $=id=>document.getElementById(id);
function render(){
  const p=PAGES[cur],st=$("stage"),tx=$("text");
  if(p.id==="end"){
    st.innerHTML=IMG.p7?`<img src="${IMG.p7}" alt="">`:"";
    tx.innerHTML=`<div class="end"><h2>Konec</h2><p style="margin:8px auto 14px">Lahko noč in lepe sanje.</p><button type="button" class="again" id="again" style="font-family:var(--display);font-weight:800;font-size:18px;border-radius:14px;padding:10px 18px;border:0;background:var(--gold);color:#2A1A08;cursor:pointer">Preberi še enkrat</button></div>`;
    $("again").onclick=()=>go(0);
  }else{
    const img=IMG[p.id]?`<img src="${IMG[p.id]}" alt="Ilustracija: stran ${cur||"naslovnica"}">`:`<div class="ph">Ilustracija prihaja …</div>`;
    st.innerHTML=img+(p.id==="cover"?`<div class="cover-title"><h1>Inja in Eva in zlati list</h1><p>jesenska pravljica</p></div>`:"");
    tx.innerHTML=`${cur?`<span class="num">Stran ${cur} od 8</span>`:""}<p>${p.t}</p>`;
  }
  $("prev").disabled=cur===0;$("next").disabled=cur===PAGES.length-1;
  $("next").textContent=cur===0?"Začni brati":"Naprej";
  $("dots").innerHTML=PAGES.map((q,i)=>`<button type="button" data-i="${i}" aria-label="${i===0?"Naslovnica":i===PAGES.length-1?"Konec":"Stran "+i}" aria-current="${i===cur}">${LEAF}</button>`).join("");
  try{localStorage.setItem("ie-page",cur);}catch(e){}
  // preload next
  const n=PAGES[cur+1];if(n&&IMG[n.id]){const im=new Image();im.src=IMG[n.id];}
}
function go(i){if(i<0||i>=PAGES.length||i===cur)return;cur=i;render();window.scrollTo({top:0,behavior:"smooth"});}
$("prev").onclick=()=>go(cur-1);$("next").onclick=()=>go(cur+1);
$("dots").onclick=e=>{const b=e.target.closest("button");if(b)go(+b.dataset.i);};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);});
let sx=null;$("stage").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("stage").addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(cur+(dx<0?1:-1));sx=null;});
$("stage").addEventListener("click",e=>{const r=e.currentTarget.getBoundingClientRect();go(cur+((e.clientX-r.left)>r.width/2?1:-1));});
render();
</script>
</body></html>
