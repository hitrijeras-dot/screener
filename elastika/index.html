function ladder(){
  const own=(S.state.bands&&S.state.bands.length?S.state.bands:[5]).slice().sort((a,b)=>a-b), m=new Map();
  own.forEach(k=>m.set(k,[k]));
  for(let i=0;i<own.length;i++)for(let j=i+1;j<own.length;j++){const t=own[i]+own[j];if(!m.has(t))m.set(t,[own[j],own[i]]);}
  return [...m.entries()].sort((a,b)=>a[0]-b[0]).map(([k,c])=>({k,c}));
}
function near(kg){const L=ladder();let best=L[0];L.forEach(x=>{if(Math.abs(x.k-kg)<Math.abs(best.k-kg))best=x;});return best.k;}
function stepKg(kg,n){const L=ladder();let i=L.findIndex(x=>x.k>=kg);if(i<0)i=L.length-1;if(L[i].k>kg&&n>0)i--;i=Math.max(0,Math.min(L.length-1,i+n));return L[i].k;}
const combo=kg=>{const x=ladder().find(y=>y.k===kg);return x?x.c:[kg];};

// ================= Faze in predlogi =================
function phaseOf(n){
  if(n<6) return {k:"uvod",label:"Uvajanje",detail:`trening ${n+1} od 6`,setsMax:2,rir:"3–4"};
  const m=(n-6)%21;
  if(m>=18) return {k:"deload",label:"Lažji teden",detail:"elastika nižje",setsMax:2,rir:"3–4"};
  return {k:"build",label:"Gradnja",detail:`${Math.floor(m/3)+1}. teden od 6`,setsMax:9,rir:"1–2"};
}
const ph=()=>phaseOf(S.state.done);
const plan=id=>{const e=EX[id],p=ph();return {sets:Math.min(e.sets,p.setsMax),lo:e.lo,hi:e.hi,rest:e.rest};};
const fmt=w=>(Math.round(w*10)/10).toString().replace(".",",");
function suggest(id){
  const e=EX[id],s=S.state.ex[id],p=plan(id),phase=ph();
  if(e.bw) return {w:0,why:"Lastna teža, brez elastike."};
  if(!s||!s.last) return {w:near(e.d),why:"Prvič: začetna ocena. Prilagodi po prvi seriji.",first:true};
  const sets=s.last.sets,top=Math.max(...sets.map(x=>x.w)),atTop=sets.filter(x=>x.w===top),reps=atTop.map(x=>x.r).join(", ");
  if(phase.k==="deload") return {w:stepKg(top,-1),why:`Lažji teden: elastika nižje.`};
  if(atTop.every(x=>x.r>=p.hi)&&!atTop.some(x=>x.f==="hard")){const w=stepKg(top,1);return {w,why:`Zadnjič ${fmt(top)} kg × ${reps}. Vse do vrha, zato močnejša elastika.`};}
  if(atTop.every(x=>x.r<p.lo)) return {w:stepKg(top,-1),why:`Zadnjič ${fmt(top)} kg × ${reps}. Premalo ponovitev, zato lažja elastika.`};
  return {w:near(top),why:`Zadnjič ${fmt(top)} kg × ${reps}. Ista elastika, cilj je več ponovitev.`};
}
function nextSet(id,set){
  const p=plan(id),phase=ph();let w=set.w,why;
  if(EX[id].bw) return {w:0,why:set.r>=p.hi?"Dobro. Naslednjič počasneje dol.":"Lastna teža."};
  if(set.r>=p.hi+6){w=stepKg(w,2);why="Bilo je veliko prelahko, zato dva koraka močneje.";}
  else if(set.r>=p.hi+3||(set.r>=p.hi&&set.f==="easy")){w=stepKg(w,1);why="Prelahko, zato močnejša elastika ali primi krajše.";}
  else if(set.r<p.lo-2||(set.r<p.lo&&set.f==="hard")||(phase.k!=="build"&&set.f==="hard")){w=stepKg(w,-1);why="Pretežko za to fazo, zato lažja elastika.";}
  else if(set.r<p.lo) why="Ista elastika. Malo pod ciljem je v redu.";
  else why="Ista elastika, dobro je.";
  return {w,why};
}

const usable=id=>S.state.anchor||!EX[id].anchor;
const byMus=k=>Object.keys(EX).filter(id=>EX[id].mus[0]===k&&usable(id));
const anyMus=k=>Object.keys(EX).filter(id=>EX[id].mus.includes(k));
function buildCustom(muscles){
  const sel=MUS.filter(m=>muscles.includes(m.k)),n=sel.length,ids=[],rot=S.state.done;
  sel.forEach(m=>{
    const want=m.tiny?(n<=2?2:1):m.big?(n<=2?3:2):(n<=3?2:1);
    let pool=byMus(m.k);if(pool.length<want)pool=pool.concat(anyMus(m.k).filter(x=>usable(x)&&!pool.includes(x)));
    const off=pool.length?rot%pool.length:0,rotd=pool.slice(off).concat(pool.slice(0,off));
    let c=0;for(const id of rotd){if(c>=want)break;if(!ids.includes(id)){ids.push(id);c++;}}
  });
  const order=id=>{const e=EX[id];return (MUS.find(m=>m.k===e.mus[0])||{}).big?0:e.sets>=3?1:2;};
  return ids.sort((a,b)=>order(a)-order(b)).slice(0,8);
}

let docRef=null,writing=false,dirty=false;
async function flush(){if(!docRef)return;dirty=true;if(writing)return;writing=true;
  while(dirty){dirty=false;const body=clone(S.state);
    try{await docRef.set(body);}catch(e){
      if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,700+Math.random()*900));try{await docRef.set(body);}catch(e2){}}
      else if(e&&(e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted")){docRef=null;S.store="local";renderTop();}}}
  writing=false;}

(async function(){

    docRef=db.doc("app/state");S.store="cloud";

      else if(S.state.done>0||Object.keys(S.state.ex).length)flush();

const L={T:60,UA:30,FA:28,TH:42,SH:42,FT:13},GROUND=196;
const rad=a=>a*Math.PI/180,dir=a=>[Math.cos(rad(a)),Math.sin(rad(a))];
const add=(p,a,l)=>{const d=dir(a);return [p[0]+d[0]*l,p[1]+d[1]*l];};
const off=(p,v)=>[p[0]+v[0],p[1]+v[1]];
const lerp=(a,b,t)=>a+(b-a)*t;
function mix(A,B,t){const o={};for(const k in A){const b=(k in B)?B[k]:A[k];o[k]=Array.isArray(A[k])?A[k].map((v,i)=>lerp(v,b[i],t)):lerp(A[k],b,t);}return o;}
function solve(an,p){
  let hip,kn,ank,toe;
  if(an.root==="ankle"){ank=[p.x,p.y];kn=add(ank,p.sh+180,L.SH);hip=add(kn,p.th+180,L.TH);toe=add(ank,p.ft,L.FT);}
  else if(an.root==="toe"){toe=[p.x,p.y];ank=add(toe,p.ft+180,L.FT);kn=add(ank,p.sh+180,L.SH);hip=add(kn,p.th+180,L.TH);}
  else if(an.root==="knee"){kn=[p.x,p.y];ank=add(kn,p.sh,L.SH);toe=add(ank,p.ft,L.FT);hip=add(kn,p.th+180,L.TH);}
  else {hip=[p.x,p.y];kn=add(hip,p.th,L.TH);ank=add(kn,p.sh,L.SH);toe=add(ank,p.ft,L.FT);}
  const sh=add(hip,p.to,L.T),head=add(sh,p.to,15);
  let el,wr;if(p.el){el=off(sh,p.el);wr=off(el,p.wr);}else{el=add(sh,p.ua,L.UA);wr=add(el,p.fa,L.FA);}
  return {hip,kn,ank,toe,sh,head,el,wr};
}
function cyc(ms){const u=(ms%3800)/3800,e=x=>0.5-0.5*Math.cos(Math.PI*x);
  if(u<0.1)return 0;if(u<0.36)return e((u-0.1)/0.26);if(u<0.44)return 1;if(u<0.9)return 1-e((u-0.44)/0.46);return 0;}
let COL=null;
function readCol(){const s=getComputedStyle(document.documentElement),g=k=>s.getPropertyValue(k).trim();
  COL={fig:g("--fig"),hl:g("--accent"),frame:g("--frame"),pad:g("--pad"),floor:g("--floor"),muted:g("--muted"),edge:g("--bandedge")};}
function G(ctx){
  const ln=(a,b,w,c)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();};
  const pl=(pts,w,c)=>{ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();};
  const ci=(p,r,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(p[0],p[1],r,0,Math.PI*2);ctx.fill();};

  return {ln,pl,ci,rr,floor(){ln([8,GROUND+2],[292,GROUND+2],3,COL.floor);},

}

function drawFront(g,an,p,col,t){
  const cx=150,hy=120,sy=60,hl=an.hl;
  g.ln([cx-10,hy],[cx-12,GROUND-2],10,COL.fig);g.ln([cx+10,hy],[cx+12,GROUND-2],10,COL.fig);
  g.ln([cx,sy+6],[cx,hy-4],30,COL.fig);g.ci([cx,sy-20],10,COL.fig);
  const W=[];
  [[1,[cx+18,sy]],[-1,[cx-18,sy]]].forEach(([s,S0])=>{let el,wr;
    if(p.el){el=[S0[0]+s*p.el[0],S0[1]+p.el[1]];wr=[el[0]+s*p.wr[0],el[1]+p.wr[1]];}
    else{el=add(S0,s>0?p.ua:180-p.ua,30);wr=add(el,s>0?p.fa:180-p.fa,28);}
    g.ln(S0,el,8.5,hl.includes("ua")?COL.hl:COL.fig);g.ln(el,wr,7.5,COL.fig);if(hl.includes("delt"))g.ci(S0,7,COL.hl);W.push([s,wr]);});
  if(an.band==="feet") W.forEach(([s,wr])=>g.band([[cx+s*12,GROUND],wr],col,t));
  if(an.band==="between") g.band([W[0][1],W[1][1]],col,t);
  W.forEach(([s,wr])=>g.ci(wr,4,COL.fig));
}
function drawEx(ctx,id,ms,W,H,col){
  const an=EX[id].a,t=cyc(ms),p=mix(an.A,an.B,t),g=G(ctx);
  ctx.clearRect(0,0,W,H);ctx.save();const s=Math.min(W/300,H/210);ctx.translate((W-300*s)/2,(H-210*s)/2);ctx.scale(s,s);
  g.floor();
  if(an.front){drawFront(g,an,p,col,t);}
  else{const P=solve(an,p);
    if(an.root==="hip"&&p.y>180) g.rr(30,GROUND-4,240,6,3,COL.pad);
    if(id==="bridge") g.rr(40,GROUND-4,230,6,3,COL.pad);
    if(an.hook){g.ci(an.hook,5,COL.frame);g.ln([an.hook[0]-14,an.hook[1]-6],[an.hook[0]+14,an.hook[1]-6],4,COL.frame);}
    drawFig(g,P,an.hl);
    if(an.band) g.band(an.band(P),col,t);
    g.ci(P.wr,4,COL.fig);}
  if(EX[id].anchor){ctx.fillStyle=COL.muted;ctx.font="600 11px Barlow, sans-serif";ctx.fillText("sidro zgoraj",10,206);}
  ctx.restore();
}

function loop(ts){

  canv.forEach(c=>{const r=c.getBoundingClientRect();if(r.bottom<0||r.top>vh||!c.isConnected)return;sizeCanvas(c);
    drawEx(c.getContext("2d"),c.dataset.anim,reduce?1400:ts+(+c.dataset.ofs||0),c.width,c.height,c.dataset.col||"#F2C318");});

function beep(){try{if(!actx)return;const t=actx.currentTime;[0,.22].forEach(o=>{const g=actx.createGain(),osc=actx.createOscillator();osc.frequency.value=880;g.gain.setValueAtTime(.0001,t+o);g.gain.exponentialRampToValueAtTime(.25,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.16);osc.connect(g).connect(actx.destination);osc.start(t+o);osc.stop(t+o+.18);});}catch(e){}}

function tickRest(){
  const r=S.rest,root=document.getElementById("restRoot");if(!r){root.innerHTML="";return;}
  const left=Math.round((r.end-Date.now())/1000),over=left<=0;
  if(over&&!r.beeped){r.beeped=true;beep();}
  if(left<-90){stopRest();return;}
  const a=Math.abs(left),t=(over?"+":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0"),pct=over?100:Math.max(0,100-(left/r.total)*100);
  root.innerHTML=`<div class="rest ${over?"over":""}" role="status"><div class="restbar" style="width:${pct}%"></div><div class="t num">${t}</div><div class="lbl">${over?"Počitek je mimo. Naslednja serija.":"Počitek · "+esc(r.label)}</div><button data-act="rest30" type="button">+30 s</button><button data-act="restskip" type="button">${over?"Zapri":"Preskoči"}</button></div>`;

  h+=!S.state.log.length?`<div class="empty">Še ni shranjenih treningov.</div>`:`<div class="log">${S.state.log.slice().reverse().slice(0,20).map(l=>`<div class="lrow num"><span><b>${dateShort(l.d)}</b> · ${esc(l.title)}</span><span>${l.sets} serij · ${l.reps} pon. · ${l.mins} min</span></div>`).join("")}</div>`;
  if(STANDALONE)h+=`<h2 class="sec">Varnostna kopija</h2><div class="note" style="margin-top:0">Treningi so shranjeni v telefonu. Enkrat na mesec shrani kopijo, da jih ne izgubiš ob menjavi telefona.</div>
   <div class="confirm"><button type="button" data-act="export">Shrani kopijo</button><button type="button" data-act="import">Naloži kopijo</button></div>
   <input type="file" id="importFile" accept="application/json,.json" hidden>${S.msg?`<div class="hint" style="margin-top:8px">${esc(S.msg)}</div>`:""}`;
  return h;
}

// ================= Akcije =================
function finishWorkout(){
  const d=S.draft,dt=d.date||today();let sets=0,reps=0;const prs=[];
  Object.entries(d.sets).forEach(([id,arr])=>{if(!arr.length||!EX[id])return;
    const s=S.state.ex[id]||(S.state.ex[id]={hist:[]});if(!s.hist)s.hist=[];
    const top=Math.max(...arr.map(x=>x.w)),rs=arr.filter(x=>x.w===top).map(x=>x.r).join(", ");
    const prev=s.hist.length?Math.max(...s.hist.map(x=>x.top)):null;if(!EX[id].bw&&prev!==null&&top>prev)prs.push(EX[id].n+" "+fmt(top)+" kg");
    s.last={d:dt,sets:arr.map(x=>({w:x.w,r:x.r,f:x.f}))};s.hist.push({d:dt,top,reps:rs});if(s.hist.length>40)s.hist=s.hist.slice(-40);
    sets+=arr.length;arr.forEach(x=>{reps+=x.r;});});
  const mins=Math.max(1,Math.round((Date.now()-d.started)/60000)),t=title();
  S.state.log.push({d:dt,wk:d.wk,title:t,sets,reps,mins});if(S.state.log.length>60)S.state.log=S.state.log.slice(-60);
  S.state.done+=1;if(d.wk!=="X")S.state.next={A:"B",B:"C",C:"A"}[d.wk];
  saveState();S.summary={title:t,sets,reps,mins,prs};
  S.draft=newDraft(S.state.next);S.draft.date="";ls.del(LS_DRAFT);S.open=null;S.confirmFinish=false;stopRest();
}
function ensureToday(){if(S.draft.date!==today()){S.draft.date=today();S.draft.started=Date.now();}}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;ensureAudio();
  const a=b.dataset.act,id=b.dataset.v;
  if(a==="tab"){S.view=id;S.msg="";render();window.scrollTo(0,0);return;}
  if(a==="rest30"){if(S.rest){S.rest.end=Math.max(S.rest.end,Date.now())+30000;S.rest.total+=30;S.rest.beeped=false;}tickRest();return;}
  if(a==="restskip"){stopRest();return;}
  if(a==="closesum"){S.summary=null;render();return;}
  if(a==="lib"){S.lib=id;S.libOpen=null;render();return;}
  if(a==="libopen"){S.libOpen=S.libOpen===id?null:id;render();return;}
  if(a==="band"){const k=+id,own=S.state.bands||[];S.state.bands=own.includes(k)?own.filter(x=>x!==k):own.concat(k);if(!S.state.bands.length)S.state.bands=[k];S.draft.cur={};saveState();saveDraft();render();return;}
  if(a==="anchor"){S.state.anchor=!S.state.anchor;saveState();render();return;}
  if(a==="import"){const f=document.getElementById("importFile");if(f)f.click();return;}
  if(a==="export"){const name=`elastika-${today()}.json`,txt=JSON.stringify(S.state);
    try{const file=new File([txt],name,{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Elastika kopija"}).then(()=>{S.msg="Kopija shranjena.";render();}).catch(()=>{});return;}}catch(e){}
    const u=URL.createObjectURL(new Blob([txt],{type:"application/json"})),x=document.createElement("a");x.href=u;x.download=name;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);S.msg="Kopija shranjena v Prenose.";render();return;}
  ensureToday();
  if(a==="picker"){S.picker=!S.picker;if(S.picker&&!S.pick.length&&S.draft.custom)S.pick=S.draft.custom.mus.slice();render();return;}
  if(a==="pickm"){S.pick=S.pick.includes(id)?S.pick.filter(x=>x!==id):S.pick.concat(id);render();return;}
  if(a==="preset"){S.pick=PRESETS[+id].m.slice();render();return;}
  if(a==="build"){const ids=buildCustom(S.pick);S.draft.wk="X";S.draft.custom={mus:S.pick.slice(),label:labelFor(S.pick),ids};S.picker=false;S.open=ids[0];saveDraft();render();window.scrollTo(0,0);return;}
  if(a==="addtoday"){if(S.draft.wk!=="X"){S.draft.custom={mus:[],label:"Trening "+S.draft.wk+" +",ids:exIds().slice()};S.draft.wk="X";}
    S.draft.custom.ids.push(id);saveDraft();S.view="today";S.open=id;render();window.scrollTo(0,0);return;}
  if(a==="wk"){S.draft.wk=id;S.picker=false;S.open=null;saveDraft();render();return;}
  if(a==="open"){S.open=S.open===id?null:id;render();return;}
  if(a==="w-"||a==="w+"){const c=cur(id);c.w=stepKg(c.w,a==="w+"?1:-1);saveDraft();render();return;}
  if(a==="r-"||a==="r+"){const c=cur(id);c.r=Math.max(1,c.r+(a==="r+"?1:-1));saveDraft();render();return;}
  if(a==="log"){const c=cur(id),f=b.dataset.f,set={w:c.w,r:c.r,f};(S.draft.sets[id]=S.draft.sets[id]||[]).push(set);
    const nx=nextSet(id,set);c.w=nx.w;c.why=nx.why;const p=plan(id),n=S.draft.sets[id].length;
    if(n>=p.sets){const nextId=exIds().find(x=>doneSets(x)<plan(x).sets);S.open=nextId||null;startRest(p.rest,nextId?"naslednja: "+EX[nextId].n:"zadnja vaja");}
    else startRest(p.rest,EX[id].n);
    keepAwake();saveDraft();render();return;}
  if(a==="undo"){const arr=S.draft.sets[id]||[];const s=arr.pop();if(s){cur(id).w=s.w;cur(id).r=s.r;cur(id).why=null;}saveDraft();render();return;}
  if(a==="swap"){const i=+id,list=exIds(),curId=list[i],cands=swapCandidates(curId,list),nx=cands[(cands.indexOf(curId)+1)%cands.length];
    if(S.draft.wk==="X"){S.draft.custom.ids[i]=nx;}else{const o=WK[S.draft.wk][i];if(nx===o)delete S.draft.swaps[o];else S.draft.swaps[o]=nx;}
    S.open=nx;saveDraft();render();return;}
  if(a==="remove"){S.draft.custom.ids=S.draft.custom.ids.filter(x=>x!==id);S.open=null;saveDraft();render();return;}
  if(a==="finish"){S.confirmFinish=true;render();return;}
  if(a==="nofinish"){S.confirmFinish=false;render();return;}
  if(a==="dofinish"){finishWorkout();render();window.scrollTo(0,0);return;}
});
document.addEventListener("change",ev=>{if(ev.target.id!=="importFile"||!ev.target.files[0])return;const fr=new FileReader();
  fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||d.v!==1||!d.ex||!Array.isArray(d.log))throw 0;S.state=Object.assign(defState(),d);saveState();S.msg=`Naloženo: ${d.done} treningov.`;}catch(e){S.msg="Te datoteke ne morem prebrati. Izberi kopijo, ki jo je shranila Elastika.";}render();};fr.readAsText(ev.target.files[0]);});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.rest)keepAwake();});
new MutationObserver(()=>readCol()).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener("change",readCol);
if(STANDALONE){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
}
render();requestAnimationFrame(loop);
})();
</script>
