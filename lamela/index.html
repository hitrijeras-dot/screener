function phaseOf(n){
  if(n<6) return {k:"uvod",label:"Uvajanje",detail:`trening ${n+1} od 6`,setsMax:2,rir:"3–4"};
  const m=(n-6)%21;
  if(m>=18) return {k:"deload",label:"Lažji teden",detail:"90 % teže",setsMax:2,rir:"3–4"};
  return {k:"build",label:"Gradnja",detail:`${Math.floor(m/3)+1}. teden od 6`,setsMax:9,rir:"1–2"};
}
const ph=()=>phaseOf(S.state.done);
const plan=id=>{const e=EX[id],p=ph();return {sets:Math.min(e.sets,p.setsMax),lo:e.lo,hi:e.hi,rest:e.rest};};
const rnd=(w,st)=>Math.max(st,Math.round(w/st)*st);
const unit=id=>EX[id].t==="fw"?(id==="gobletsq"||id==="ohext"||id==="hipthrust"?"kg":"kg / ročka"):"kg";
const fmt=w=>(Math.round(w*10)/10).toString().replace(".",",");
function suggest(id){
  const e=EX[id],st=e.st,s=S.state.ex[id],p=plan(id),phase=ph();
  if(id==="legraise") return {w:0,why:"Lastna teža."};
  if(!s||!s.last) return {w:e.d,why:"Prvič: začetna ocena. Prilagodi po prvi seriji.",first:true};
  const sets=s.last.sets,top=Math.max(...sets.map(x=>x.w)),atTop=sets.filter(x=>x.w===top),reps=atTop.map(x=>x.r).join(", ");
  if(phase.k==="deload") return {w:rnd(top*0.9,st),why:`Lažji teden: 90 % od ${fmt(top)} kg.`};
  if(atTop.every(x=>x.r>=p.hi)&&!atTop.some(x=>x.f==="hard")) return {w:top+st,why:`Zadnjič ${fmt(top)} kg × ${reps}. Vse serije do vrha, zato +${fmt(st)} kg.`};
  if(atTop.every(x=>x.r<p.lo)) return {w:Math.max(st,top-st),why:`Zadnjič ${fmt(top)} kg × ${reps}. Premalo ponovitev, zato −${fmt(st)} kg.`};
  return {w:top,why:`Zadnjič ${fmt(top)} kg × ${reps}. Ista teža, cilj je več ponovitev.`};
}
function nextSet(id,set){
  const st=EX[id].st,p=plan(id),phase=ph();let w=set.w,why;
  if(id==="legraise") return {w:0,why:set.r>=p.hi?"Dobro. Naslednjič počasneje dol.":"Lastna teža."};
  if(set.r>=p.hi+6){w+=2*st;why=`Bilo je veliko prelahko, zato +${fmt(2*st)} kg.`;}
  else if(set.r>=p.hi+3||(set.r>=p.hi&&set.f==="easy")){w+=st;why=`Prelahko, zato +${fmt(st)} kg.`;}
  else if(set.r<p.lo-2||(set.r<p.lo&&set.f==="hard")||(phase.k!=="build"&&set.f==="hard")){w=Math.max(st,w-st);why=`Pretežko za to fazo, zato −${fmt(st)} kg.`;}
  else if(set.r<p.lo) why="Ista teža. Malo pod ciljem je v redu.";
  else why="Ista teža, dobro je.";
  return {w,why};
}

function buildCustom(muscles){
  const sel=MUS.filter(m=>muscles.includes(m.k)); const n=sel.length; const ids=[]; const rot=S.state.done;
  sel.forEach(m=>{
    const want=m.tiny?(n<=2?2:1):m.big?(n<=2?3:2):(n<=3?2:1);
    let pool=byMus(m.k); if(pool.length<want) pool=pool.concat(anyMus(m.k).filter(x=>!pool.includes(x)));
    const off=pool.length?rot%pool.length:0; const rotd=pool.slice(off).concat(pool.slice(0,off));
    let c=0; for(const id of rotd){ if(c>=want) break; if(!ids.includes(id)){ids.push(id);c++;} }
  });
  const order=id=>{const e=EX[id];return (e.mus[0]&&MUS.find(m=>m.k===e.mus[0])||{}).big?0:e.sets>=3?1:2;};
  return ids.sort((a,b)=>order(a)-order(b)).slice(0,8);
}

let docRef=null,writing=false,dirty=false;
async function flush(){ if(!docRef) return; dirty=true; if(writing) return; writing=true;
  while(dirty){dirty=false;const body=clone(S.state);
    try{await docRef.set(body);}catch(e){
      if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,700+Math.random()*900));try{await docRef.set(body);}catch(e2){}}
      else if(e&&(e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted")){docRef=null;S.store="local";renderTop();}}}
  writing=false;}
function saveState(){ls.set(LS_STATE,S.state);flush();}
(async function(){
  try{
    if(!window.claude||!window.claude.use){S.store="local";renderTop();return;}
    const db=await window.claude.use("db"); if(!db){S.store="local";renderTop();return;}
    docRef=db.doc("app/state"); S.store="cloud";
    docRef.onSnapshot(snap=>{

      if(snap.exists){const d=snap.data(); if(d&&d.v){S.state=clone(d); ls.set(LS_STATE,S.state); render();}}
      else if(S.state.done>0||Object.keys(S.state.ex).length) flush();

    renderTop();
  }catch(e){S.store="local";renderTop();}
})();

function mix(A,B,t){const o={};for(const k in A){const b=(k in B)?B[k]:A[k];o[k]=Array.isArray(A[k])?A[k].map((v,i)=>lerp(v,b[i],t)):lerp(A[k],b,t);}return o;}
function solve(an,p){
  let hip,kn,ank,toe;
  if(an.root==="ankle"){ank=[p.x,p.y];kn=add(ank,p.sh+180,L.SH);hip=add(kn,p.th+180,L.TH);toe=add(ank,p.ft,L.FT);}

  else {hip=[p.x,p.y];kn=add(hip,p.th,L.TH);ank=add(kn,p.sh,L.SH);toe=add(ank,p.ft,L.FT);}
  const sh=add(hip,p.to,L.T), head=add(sh,p.to,15), base=an.armRel?p.to+90:0;
  let el,wr; if(p.el){el=off(sh,p.el);wr=off(el,p.wr);} else {el=add(sh,p.ua+base,L.UA);wr=add(el,p.fa+base,L.FA);}

      <div class="links">${sets.length?`<button class="link" type="button" data-act="undo" data-v="${id}">Razveljavi zadnjo serijo</button>`:""}${!sets.length&&swapCandidates(id,exIds()).length>1?`<button class="link" type="button" data-act="swap" data-v="${i}">Naprava zasedena? Zamenjaj vajo</button>`:""}${S.draft.wk==="X"&&!sets.length?`<button class="link" type="button" data-act="remove" data-v="${id}">Odstrani</button>`:""}</div>
    </div>`;}
  return h+`</article>`;
}
function viewLib(){
  let h=`<div class="filters" role="group" aria-label="Mišice">${MUS.map(m=>`<button type="button" aria-pressed="${S.lib===m.k}" data-act="lib" data-v="${m.k}">${esc(m.n)}</button>`).join("")}</div>`;
  const ids=anyMus(S.lib).sort((a,b)=>(EX[a].mus[0]===S.lib?0:1)-(EX[b].mus[0]===S.lib?0:1));
  h+=`<h2 class="sec">${esc(MN[S.lib])}</h2><div class="list" style="margin-top:0">`;
  ids.forEach((id,i)=>{const e=EX[id],open=S.libOpen===id,inToday=exIds().includes(id);
    h+=`<article class="ex"><button class="exhead" type="button" data-act="libopen" data-v="${id}" aria-expanded="${open}"><div class="thumb">${phTb(id,open?`<div style="aspect-ratio:300/210;display:grid;place-items:center;color:var(--muted);font-size:12px">spodaj ↓</div>`:cv(id,i*500))}</div>
      <div style="min-width:0"><div class="exname">${esc(e.n)}</div><div class="exsub">${e.t==="tg"?"Technogym naprava":"Proste uteži"} · ${e.lo}–${e.hi} ponovitev</div><div class="tags">${tags(id)}</div></div><div></div></button>`;
    if(open) h+=`<div class="body"><div class="stage"><span class="tempo">1 s gor · 2 s dol</span>${phSt(id,cv(id))}</div><ol class="howto">${e.how.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
      ${inToday?`<div class="hint">Že v današnjem treningu.</div>`:`<button class="addbtn" type="button" data-act="addtoday" data-v="${id}">Dodaj v današnji trening</button>`}</div>`;
    h+=`</article>`;});
  return h+`</div>`;
}
function viewProgram(){
  const p=ph();
  let h=`<section class="hero"><div class="meta">3 treningi na teden</div><h1>Program za maso</h1>
  <div class="row"><span class="chip phase">Zdaj: ${esc(p.label)} · ${esc(p.detail)}</span><span class="chip">Naslednji: Trening ${esc(S.state.next)}</span></div></section>
  <h2 class="sec">Celo telo A · B · C</h2><div class="prog">`;
  ["A","B","C"].forEach(k=>{h+=`<div class="pcard"><h3>Trening ${k} <small>${esc(WK_FOCUS[k])}</small></h3><div class="pl">${WK[k].map(id=>{const q=plan(id);return `<span>${esc(EX[id].n)}</span><span class="num">${q.sets} × ${q.lo}–${q.hi}</span>`}).join("")}</div></div>`;});
  h+=`</div><div class="note">Lahko pa trening sestaviš sam: na zavihku Danes pritisni <b>Po mišicah</b> in izberi npr. prsa + triceps.</div>
  <h2 class="sec">Kako app izbere težo</h2><ol class="rules">
  <li>Vsaka vaja ima razpon ponovitev, npr. 8–12. Ko pri isti teži v vseh serijah prideš do vrha, app naslednjič doda en korak: 5 kg na napravi, 2 kg na ročki.</li>
  <li>Če ne prideš do spodnje meje, app težo zmanjša za en korak. Vmes ostane ista teža, ti pa ciljaš na več ponovitev.</li>
  <li>Med treningom app po vsaki seriji predlaga težo za naslednjo, glede na ponovitve in to, kako težko je bilo.</li>
  <li>Isto mišico treniraj največ vsak drugi dan.</li></ol>
  <h2 class="sec">Faze</h2><ol class="rules">
  <li><b>Uvajanje</b> (prvih 6 treningov): 2 seriji, 3–4 ponovitve v rezervi. Mišice se spomnijo hitro, kite in sklepi počasneje.</li>
  <li><b>Gradnja</b> (6 tednov): polno število serij, 1–2 ponovitvi v rezervi.</li>
  <li><b>Lažji teden</b>: 2 seriji z 90 % teže, potem nov krog gradnje.</li></ol>
  <div class="note">RIR pomeni, koliko ponovitev bi še zmogel. RIR 2 = končal si, ko bi šli še dve.</div>`;
  return h;
}
function spark(vals){
  if(vals.length<2) return `<svg viewBox="0 0 96 36" aria-hidden="true"><line x1="0" y1="18" x2="96" y2="18" stroke="var(--line)" stroke-width="1"/><circle cx="90" cy="18" r="3" fill="var(--accent)"/></svg>`;
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1,pts=vals.map((v,i)=>[4+i*(88/(vals.length-1)),30-(v-mn)/rg*24]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" "),l=pts[pts.length-1];
  return `<svg viewBox="0 0 96 36" aria-hidden="true"><path d="${d} L ${l[0].toFixed(1)} 34 L 4 34 Z" fill="var(--accent-soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="3" fill="var(--accent)"/></svg>`;
}
function viewProgress(){
  const ids=Object.keys(EX).filter(id=>S.state.ex[id]&&S.state.ex[id].hist&&S.state.ex[id].hist.length);
  let h=`<section class="hero"><div class="meta">${S.state.done} opravljenih treningov</div><h1>Napredek</h1></section><h2 class="sec">Vaje</h2>`;
  if(!ids.length) h+=`<div class="empty">Tukaj se bo pokazala najvišja teža pri vsaki vaji in kako raste. Ko zaključiš prvi trening, se vaje pojavijo tukaj.</div>`;
  else h+=`<div class="hist">${ids.map(id=>{const hs=S.state.ex[id].hist,f=hs[0],l=hs[hs.length-1],d=l.top-f.top;
    return `<div class="hrow"><div class="n">${esc(EX[id].n)}</div>${spark(hs.map(x=>x.top))}<div class="s num">${fmt(l.top)} ${unit(id)} × ${l.reps}${d>0?` · <span class="up">+${fmt(d)} kg</span>`:""} · ${hs.length}×</div></div>`;}).join("")}</div>`;
  h+=`<h2 class="sec">Zadnji treningi</h2>`;
  h+=!S.state.log.length?`<div class="empty">Še ni shranjenih treningov.</div>`:`<div class="log">${S.state.log.slice().reverse().slice(0,20).map(l=>`<div class="lrow num"><span><b>${dateShort(l.d)}</b> · ${esc(l.title||("Trening "+l.wk))}</span><span>${l.sets} serij · ${fmt(Math.round(l.vol))} kg · ${l.mins} min</span></div>`).join("")}</div>`;
  if(STANDALONE) h+=`<h2 class="sec">Varnostna kopija</h2><div class="note" style="margin-top:0">Treningi so shranjeni v telefonu. Enkrat na mesec shrani kopijo, da jih ne izgubiš ob menjavi telefona.</div>
   <div class="confirm"><button type="button" data-act="export">Shrani kopijo</button><button type="button" data-act="import">Naloži kopijo</button></div>
   <input type="file" id="importFile" accept="application/json,.json" hidden>${S.msg?`<div class="hint" style="margin-top:8px">${esc(S.msg)}</div>`:""}`;
  return h;
}

// ================= Akcije =================
function finishWorkout(){
  const d=S.draft,dt=d.date||today();let sets=0,vol=0;const prs=[];
  Object.entries(d.sets).forEach(([id,arr])=>{if(!arr.length||!EX[id])return;
    const s=S.state.ex[id]||(S.state.ex[id]={seat:"",hist:[]});if(!s.hist)s.hist=[];
    const top=Math.max(...arr.map(x=>x.w)),reps=arr.filter(x=>x.w===top).map(x=>x.r).join(", ");
    const prev=s.hist.length?Math.max(...s.hist.map(x=>x.top)):null;if(prev!==null&&top>prev)prs.push(EX[id].n+" "+fmt(top)+" kg");
    s.last={d:dt,sets:arr.map(x=>({w:x.w,r:x.r,f:x.f}))};s.hist.push({d:dt,top,reps});if(s.hist.length>40)s.hist=s.hist.slice(-40);
    sets+=arr.length;arr.forEach(x=>{vol+=x.w*x.r*(unit(id)==="kg / ročka"?2:1);});});
  const mins=Math.max(1,Math.round((Date.now()-d.started)/60000)),t=title();
  S.state.log.push({d:dt,wk:d.wk,title:t,sets,vol:Math.round(vol),mins});if(S.state.log.length>60)S.state.log=S.state.log.slice(-60);
  S.state.done+=1; if(d.wk!=="X") S.state.next={A:"B",B:"C",C:"A"}[d.wk];
  saveState(); S.summary={title:t,sets,vol,mins,prs};
  S.draft=newDraft(S.state.next);S.draft.date="";ls.del(LS_DRAFT);S.open=null;S.confirmFinish=false;stopRest();
}
function ensureToday(){if(S.draft.date!==today()){S.draft.date=today();S.draft.started=Date.now();}}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;ensureAudio();
  const a=b.dataset.act,id=b.dataset.v;
  if(a==="tab"){S.view=id;render();window.scrollTo(0,0);return;}
  if(a==="rest30"){if(S.rest){S.rest.end=Math.max(S.rest.end,Date.now())+30000;S.rest.total+=30;S.rest.beeped=false;}tickRest();return;}
  if(a==="restskip"){stopRest();return;}
  if(a==="closesum"){S.summary=null;render();return;}
  if(a==="lib"){S.lib=id;S.libOpen=null;render();return;}
  if(a==="libopen"){S.libOpen=S.libOpen===id?null:id;render();return;}
  if(a==="import"){const f=document.getElementById("importFile");if(f)f.click();return;}
  if(a==="export"){const name=`lamela-${today()}.json`,txt=JSON.stringify(S.state);
    try{const file=new File([txt],name,{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Lamela kopija"}).then(()=>{S.msg="Kopija shranjena.";render();}).catch(()=>{});return;}}catch(e){}
    const u=URL.createObjectURL(new Blob([txt],{type:"application/json"})),x=document.createElement("a");x.href=u;x.download=name;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);S.msg="Kopija shranjena v Prenose.";render();return;}
  ensureToday();
  if(a==="picker"){S.picker=!S.picker;if(S.picker&&!S.pick.length&&S.draft.custom)S.pick=S.draft.custom.mus.slice();render();return;}
  if(a==="pickm"){S.pick=S.pick.includes(id)?S.pick.filter(x=>x!==id):S.pick.concat(id);render();return;}
  if(a==="preset"){S.pick=PRESETS[+id].m.slice();render();return;}
  if(a==="build"){const ids=buildCustom(S.pick);S.draft.wk="X";S.draft.custom={mus:S.pick.slice(),label:labelFor(S.pick),ids};S.picker=false;S.open=ids[0];saveDraft();render();window.scrollTo(0,0);return;}
  if(a==="addtoday"){if(S.draft.wk!=="X"){S.draft.custom={mus:[],label:"Trening "+S.draft.wk+" +",ids:exIds().slice()};S.draft.wk="X";}
    S.draft.custom.ids.push(id);S.draft.custom.label=S.draft.custom.label||"Moj trening";saveDraft();S.view="today";S.open=id;render();window.scrollTo(0,0);return;}
  if(a==="wk"){S.draft.wk=id;S.picker=false;S.open=null;saveDraft();render();return;}
  if(a==="open"){S.open=S.open===id?null:id;render();return;}
  if(a==="w-"||a==="w+"){const c=cur(id),st=EX[id].st;c.w=Math.max(0,Math.round((c.w+(a==="w+"?st:-st))*10)/10);saveDraft();render();return;}
  if(a==="r-"||a==="r+"){const c=cur(id);c.r=Math.max(1,c.r+(a==="r+"?1:-1));saveDraft();render();return;}
  if(a==="log"){const c=cur(id),f=b.dataset.f,set={w:c.w,r:c.r,f};(S.draft.sets[id]=S.draft.sets[id]||[]).push(set);
    const nx=nextSet(id,set);c.w=nx.w;c.why=nx.why;const p=plan(id),n=S.draft.sets[id].length;
    if(n>=p.sets){const nextId=exIds().find(x=>doneSets(x)<plan(x).sets);S.open=nextId||null;startRest(p.rest,nextId?"naslednja: "+EX[nextId].n:"zadnja vaja");}
    else startRest(p.rest,EX[id].n);
    keepAwake();saveDraft();render();return;}
  if(a==="undo"){const arr=S.draft.sets[id]||[];const s=arr.pop();if(s){cur(id).w=s.w;cur(id).r=s.r;cur(id).why=null;}saveDraft();render();return;}
  if(a==="swap"){const i=+id,list=exIds(),curId=list[i],cands=swapCandidates(curId,list),nx=cands[(cands.indexOf(curId)+1)%cands.length];
    if(S.draft.wk==="X"){S.draft.custom.ids[i]=nx;}else{const o=WK[S.draft.wk][i];if(nx===o)delete S.draft.swaps[o];else S.draft.swaps[o]=nx;}
    S.open=nx;saveDraft();render();return;}
  if(a==="remove"){S.draft.custom.ids=S.draft.custom.ids.filter(x=>x!==id);S.open=null;saveDraft();render();return;}
  if(a==="finish"){S.confirmFinish=true;render();return;}
  if(a==="nofinish"){S.confirmFinish=false;render();return;}
  if(a==="dofinish"){finishWorkout();render();window.scrollTo(0,0);return;}
});
let seatT=null;
document.addEventListener("input",ev=>{const id=ev.target.dataset&&ev.target.dataset.seat;if(!id)return;
  const s=S.state.ex[id]||(S.state.ex[id]={seat:"",hist:[]});s.seat=ev.target.value.slice(0,60);ls.set(LS_STATE,S.state);clearTimeout(seatT);seatT=setTimeout(()=>flush(),1200);});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.rest)keepAwake();});
new MutationObserver(()=>readCol()).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
if(window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change",readCol);

document.addEventListener("change",ev=>{if(ev.target.id!=="importFile"||!ev.target.files[0])return;const fr=new FileReader();
  fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||d.v!==1||!d.ex||!Array.isArray(d.log))throw 0;S.state=d;saveState();S.msg=`Naloženo: ${d.done} treningov.`;}catch(e){S.msg="Te datoteke ne morem prebrati. Izberi kopijo, ki jo je shranila Lamela.";}render();};fr.readAsText(ev.target.files[0]);});
if(STANDALONE){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
}
render(); requestAnimationFrame(loop);
})();
</script>
