<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16171A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Kader"><meta name="description" content="Nasveti za boljšo fotografijo in poze."><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><script>window.__KADER_APP__=true</script><title>Kader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column. Every pose sits inside a viewfinder frame (AF corners + thirds grid), tips are cards with small diagrams. */
:root{
  --bg:#F2F1EE; --surface:#FFFFFF; --sunk:#ECEBE7; --ink:#16171A; --muted:#62646B; --line:#DCDAD4;
  --accent:#2E5CE6; --accent-ink:#FFFFFF; --accent-soft:#E2E9FD;
  --figA:#2A2E36; --figB:#8C9AB9; --figK:#B9825C; --dress:#FFFFFF; --prop:#C9C6BE; --vf:#F7F6F3; --grid:rgba(0,0,0,.08); --hl:#2E5CE6;
  --good:#1E8E4E;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101113; --surface:#18191C; --sunk:#202125; --ink:#ECECEE; --muted:#9C9EA6; --line:#2B2C31;
  --accent:#7C9BFF; --accent-ink:#0B1638; --accent-soft:#1D2747;
  --figA:#E4E6EA; --figB:#7E8BA8; --figK:#D2996F; --dress:#F4F2EE; --prop:#3A3C42; --vf:#151619; --grid:rgba(255,255,255,.07); --hl:#7C9BFF;
  --good:#5ED08A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101113; --surface:#18191C; --sunk:#202125; --ink:#ECECEE; --muted:#9C9EA6; --line:#2B2C31;
  --accent:#7C9BFF; --accent-ink:#0B1638; --accent-soft:#1D2747;
  --figA:#E4E6EA; --figB:#7E8BA8; --figK:#D2996F; --dress:#F4F2EE; --prop:#3A3C42; --vf:#151619; --grid:rgba(255,255,255,.07); --hl:#7C9BFF;
  --good:#5ED08A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:620px;margin:0 auto;padding-inline:16px;padding-block:12px 70px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .rec{width:10px;height:10px;border-radius:50%;background:#E5483A;box-shadow:0 0 0 3px rgba(229,72,58,.2)}
.store{font-size:12px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:10px}
.tabs button{border:0;background:transparent;padding:8px 2px;border-radius:8px;font-weight:700;font-size:14.5px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.02;margin:18px 0 4px;letter-spacing:-.02em;text-wrap:balance}
h2.sec{font-family:var(--f-display);font-weight:800;font-size:21px;margin:22px 0 8px;letter-spacing:-.01em}
.lede{color:var(--muted);margin:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-top:12px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button .n{opacity:.55;font-weight:600;margin-left:4px}
.daily{margin-top:14px;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:16px;display:grid;gap:6px}
.daily small{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;opacity:.85}
.daily b{font-family:var(--f-display);font-size:21px;line-height:1.15}
.daily button{justify-self:start;border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}
.tips{display:grid;gap:10px;margin-top:10px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:start}
.tip h3{margin:0;font-size:16px;font-weight:700;line-height:1.3}
.tip p{margin:0;color:var(--muted);font-size:14.5px;grid-column:1}
.tip .why{grid-column:1;font-size:13.5px;color:var(--ink);opacity:.85}
.tip .why b{color:var(--accent)}
.tip svg{grid-row:1 / span 3;grid-column:2;width:88px;height:66px;border-radius:8px;background:var(--vf);border:1px solid var(--line)}
.poses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
@media (max-width:380px){.poses{grid-template-columns:1fr}}
.pose{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;text-align:left;padding:0}
.pose .vf{position:relative;background:var(--vf);border-bottom:1px solid var(--line)}
.pose .vf svg{display:block;width:100%;height:auto}
.pose .star{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:17px;line-height:1}
.pose .star[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pose .meta{padding:10px 12px 12px;display:grid;gap:3px}
.pose h3{margin:0;font-size:15px;font-weight:700;line-height:1.25}
.pose .s{color:var(--muted);font-size:13px}
.detail{grid-column:1 / -1;background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;overflow:hidden;display:grid}
.detail .vf{background:var(--vf);border-bottom:1px solid var(--line);position:relative}
.detail .vf svg{display:block;width:100%;max-width:420px;margin:0 auto;height:auto}
.detail .body{padding:14px;display:grid;gap:12px}
.detail h3{margin:0;font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.1}
.steps{margin:0;padding-left:22px;display:grid;gap:5px}
.steps li::marker{font-weight:800;color:var(--accent)}
.say{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:15px}
.say b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.ptip{font-size:14px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:8px 13px;font-weight:700;font-size:14px}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:11px 14px;font-size:14.5px;color:var(--muted);margin-top:12px}
.note b{color:var(--ink)}
.list{display:grid;gap:8px;margin-top:10px}
.li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.li svg{width:64px;height:auto;border-radius:8px;background:var(--vf)}
.li b{font-size:15px;display:block;line-height:1.25}
.li span{color:var(--muted);font-size:13px}
.li.done{opacity:.55}
.li.done b{text-decoration:line-through}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;font-size:16px;font-weight:800;display:grid;place-items:center}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.empty{color:var(--muted);font-size:15px;padding:14px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;margin-top:10px}
.src{display:grid;gap:6px;margin-top:8px;font-size:14px}
.src a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;word-break:break-word}
</style>

</head><body><div class="wrap" id="app"></div>

<script>
(function(){
"use strict";
const STANDALONE=!!window.__KADER_APP__;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ================= Figure (2D pogled) =================
const dir=a=>[Math.cos(a*Math.PI/180),Math.sin(a*Math.PI/180)];
const add=(p,a,l)=>{const d=dir(a);return [p[0]+d[0]*l,p[1]+d[1]*l];};
const GY=s=>205-75*s;
// osnovna stoječa figura; o prepiše privzete vrednosti
const ST=(x,o={})=>{const s=o.s||1;return Object.assign({x,y:GY(s),s,to:-90,hd:0,tw:1,la:[100,95],ra:[80,85],ll:[94,90],rl:[86,90],c:"A"},o);};
const P2=p=>p.toFixed(1);
function figSvg(f){
  const s=f.s,col=f.c==="B"?"var(--figB)":f.c==="K"?"var(--figK)":"var(--figA)";
  const hip=[f.x,f.y],n=f.to+90,sw=16*s*f.tw,hw=12*s*f.tw;
  const shC=add(hip,f.to,52*s),shL=add(shC,n+180,sw),shR=add(shC,n,sw),hipL=add(hip,n+180,hw),hipR=add(hip,n,hw);
  const head=add(shC,f.to+(f.hd||0),14*s);
  const arm=(sh,a)=>{const e=add(sh,a[0],26*s),w=add(e,a[1],24*s);return [sh,e,w];};
  const leg=(h,l)=>{const k=add(h,l[0],36*s),an=add(k,l[1],36*s),toe=add(an,l[2]!=null?l[2]:(Math.abs(((l[1]%360)+360)%360-90)<45?0:l[1]+90),9*s);return [h,k,an,toe];};
  const LA=arm(shL,f.la),RA=arm(shR,f.ra),LL=leg(add(hip,n+180,hw*.55),f.ll),RL=leg(add(hip,n,hw*.55),f.rl);
  const line=(pts,w,c,op)=>`<polyline points="${pts.map(p=>P2(p[0])+","+P2(p[1])).join(" ")}" fill="none" stroke="${c||col}" stroke-width="${(w*s).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round"${op?` opacity="${op}"`:""}/>`;
  let h="";
  if(f.hair==="long"){const hb=add(head,f.to+180,2*s);h+=`<ellipse cx="${P2(hb[0])}" cy="${P2(hb[1]+9*s)}" rx="${P2(11.5*s)}" ry="${P2(17*s)}" fill="${col}" opacity=".55" transform="rotate(${(f.to+90).toFixed(0)} ${P2(hb[0])} ${P2(hb[1])})"/>`;}
  // zadnja okončina (bledejša)
  const back=f.front==="L"?[RA,RL]:[LA,LL],frontL=f.front==="L"?[LA,LL]:[RA,RL];
  h+=line(back[1].slice(0,3),9,null,.6)+line(back[1].slice(2),4.5,null,.6);
  h+=line(frontL[1].slice(0,3),9.5)+line(frontL[1].slice(2),4.5);
  if(f.dress){const w1=add(hip,n+180,hw*1.05),w2=add(hip,n,hw*1.05),b1=[hip[0]-28*s,GY(s)+70*s],b2=[hip[0]+28*s,GY(s)+70*s];
    const yb=f.y+(f.seat?30*s:72*s);h+=`<path d="M${P2(w1[0])} ${P2(w1[1])} L${P2(w2[0])} ${P2(w2[1])} L${P2(f.x+30*s)} ${P2(yb)} Q${P2(f.x)} ${P2(yb+6*s)} ${P2(f.x-30*s)} ${P2(yb)} Z" fill="var(--dress)" stroke="${col}" stroke-width="${(1.6*s).toFixed(1)}" stroke-linejoin="round"/>`;}
  h+=line(back[0],7,null,.6);
  h+=`<path d="M${P2(hipL[0])} ${P2(hipL[1])} L${P2(hipR[0])} ${P2(hipR[1])} L${P2(shR[0])} ${P2(shR[1])} L${P2(shL[0])} ${P2(shL[1])} Z" fill="${col}" stroke="${col}" stroke-width="${(7*s).toFixed(1)}" stroke-linejoin="round"/>`;
  if(f.dress){const w1=add(hip,n+180,hw*1.05),w2=add(hip,n,hw*1.05);h+=`<path d="M${P2(hipL[0])} ${P2(hipL[1])} L${P2(hipR[0])} ${P2(hipR[1])} L${P2(shR[0])} ${P2(shR[1])} L${P2(shL[0])} ${P2(shL[1])} Z" fill="var(--dress)" stroke="${col}" stroke-width="${(1.6*s).toFixed(1)}" stroke-linejoin="round"/>`;}
  h+=line([shC,head],6);
  h+=`<circle cx="${P2(head[0])}" cy="${P2(head[1])}" r="${P2(10*s)}" fill="${col}"/>`;
  if(f.veil){h+=`<path d="M${P2(head[0]-6*s)} ${P2(head[1]-8*s)} Q${P2(head[0]-26*s)} ${P2(head[1]+30*s)} ${P2(head[0]-18*s)} ${P2(head[1]+70*s)}" fill="none" stroke="var(--dress)" stroke-width="${(5*s).toFixed(1)}" opacity=".85" stroke-linecap="round"/>`;}
  h+=line(frontL[0],7.5);
  if(f.prop==="bouquet"){const w=frontL[0][2];h+=`<circle cx="${P2(w[0])}" cy="${P2(w[1])}" r="${P2(8*s)}" fill="var(--hl)" opacity=".9"/><circle cx="${P2(w[0]-4*s)}" cy="${P2(w[1]-3*s)}" r="${P2(4*s)}" fill="var(--dress)" opacity=".9"/>`;}
  if(f.prop==="toy"){const w=frontL[0][2];h+=`<rect x="${P2(w[0]-6*s)}" y="${P2(w[1]-6*s)}" width="${P2(12*s)}" height="${P2(12*s)}" rx="${P2(3*s)}" fill="var(--hl)"/>`;}
  return h;
}
// rekviziti
const PROP={
  stool:(x,y)=>`<rect x="${x-20}" y="${y}" width="40" height="6" rx="3" fill="var(--prop)"/><line x1="${x-14}" y1="${y+6}" x2="${x-18}" y2="205" stroke="var(--prop)" stroke-width="4"/><line x1="${x+14}" y1="${y+6}" x2="${x+18}" y2="205" stroke="var(--prop)" stroke-width="4"/>`,
  chair:(x,y)=>`<rect x="${x-22}" y="${y}" width="44" height="7" rx="3" fill="var(--prop)"/><rect x="${x-26}" y="${y-48}" width="7" height="55" rx="3" fill="var(--prop)"/><line x1="${x-20}" y1="${y+7}" x2="${x-20}" y2="205" stroke="var(--prop)" stroke-width="4"/><line x1="${x+18}" y1="${y+7}" x2="${x+18}" y2="205" stroke="var(--prop)" stroke-width="4"/>`,
  bed:y=>`<rect x="8" y="${y}" width="184" height="16" rx="6" fill="var(--prop)"/><rect x="8" y="${y+16}" width="184" height="${205-y-16}" fill="var(--prop)" opacity=".45"/><rect x="14" y="${y-9}" width="38" height="11" rx="5" fill="var(--prop)" opacity=".8"/>`,
  wall:x=>`<rect x="${x}" y="40" width="10" height="165" fill="var(--prop)"/>`,
  window:x=>`<rect x="${x}" y="30" width="34" height="120" rx="3" fill="none" stroke="var(--prop)" stroke-width="5"/><line x1="${x+17}" y1="30" x2="${x+17}" y2="150" stroke="var(--prop)" stroke-width="3"/><path d="M${x+34} 40 L${x+90} 120 L${x+90} 170 L${x+34} 150 Z" fill="var(--hl)" opacity=".12"/>`,
  table:(x,y)=>`<rect x="${x-34}" y="${y}" width="68" height="7" rx="3" fill="var(--prop)"/><line x1="${x-26}" y1="${y+7}" x2="${x-26}" y2="205" stroke="var(--prop)" stroke-width="4"/><line x1="${x+26}" y1="${y+7}" x2="${x+26}" y2="205" stroke="var(--prop)" stroke-width="4"/>`,
  floor:()=>``,
  bench:(x,y,w)=>`<rect x="${x-w/2}" y="${y}" width="${w}" height="8" rx="3" fill="var(--prop)"/><line x1="${x-w/2+8}" y1="${y+8}" x2="${x-w/2+8}" y2="205" stroke="var(--prop)" stroke-width="4"/><line x1="${x+w/2-8}" y1="${y+8}" x2="${x+w/2-8}" y2="205" stroke="var(--prop)" stroke-width="4"/>`
};
function viewfinder(inner){
  return `<svg viewBox="0 0 200 220" role="img"><rect width="200" height="220" fill="var(--vf)"/>
  <g stroke="var(--grid)" stroke-width="1"><line x1="66.7" y1="0" x2="66.7" y2="220"/><line x1="133.3" y1="0" x2="133.3" y2="220"/><line x1="0" y1="73.3" x2="200" y2="73.3"/><line x1="0" y1="146.7" x2="200" y2="146.7"/></g>
  <line x1="6" y1="205" x2="194" y2="205" stroke="var(--prop)" stroke-width="2"/><g transform="translate(100 205) scale(1.14) translate(-100 -205)">${inner}</g>
  <g fill="none" stroke="var(--hl)" stroke-width="2.2" stroke-linecap="round" opacity=".8"><path d="M8 22 V8 H22"/><path d="M178 8 H192 V22"/><path d="M8 198 V212 H22"/><path d="M178 212 H192 V198"/></g></svg>`;
}
const sitY=y=>y; // hip height when seated
// sedeča figura (pogled 3/4 od strani): hip na sedežu, stegna naprej, golen dol
const SIT=(x,y,o={})=>Object.assign({x,y,s:1,to:-92,hd:0,tw:.75,la:[100,95],ra:[80,85],ll:[-4,90],rl:[4,92],c:"A",seat:1},o);

// ================= Poze =================
const CATS=[
 {k:"zenska",n:"Portret ženske"},{k:"moski",n:"Portret moškega"},{k:"pari",n:"Pari"},{k:"poroka",n:"Poroka"},
 {k:"druzina",n:"Družina"},{k:"otroci",n:"Otroci"},{k:"skupine",n:"Skupine"},{k:"boudoir",n:"Boudoir"}];
const POSES=[
 // ---- ženska
 {id:"z1",k:"zenska",n:"S-linija, teža na zadnji nogi",s:"Najbolj laskava osnovna poza",
  how:["Teža na zadnjo nogo, sprednje koleno rahlo upogni proti drugemu.","Boke potisni malo vstran, zgornji del telesa rahlo naprej.","Ena roka mehko na bok, druga sproščeno ob telesu."],
  say:"»Prenesi težo na zadnjo nogo in mi pokaži malo boka.«",tip:"Telo pod kotom ~30° glede na kamero, obraz proti kameri.",
  fig:()=>[ST(100,{to:-96,hd:-8,hair:"long",ll:[80,98],rl:[96,90],ra:[38,160]})]},
 {id:"z2",k:"zenska",n:"Roka v laseh",s:"Sproščeno, ženstveno",
  how:["Ena roka gre počasi v lase, kot da jih popravlja.","Komolec naj ne kaže naravnost v kamero.","Druga roka mehko ob telesu ali na pasu."],
  say:"»Popravi si lase za ušesom in ne glej v kamero.«",tip:"Fotografiraj med gibom, ne ko roka obmiruje.",
  fig:()=>[ST(100,{to:-93,hd:10,hair:"long",la:[-120,8],ll:[84,96],front:"L"})]},
 {id:"z3",k:"zenska",n:"Sede, nagnjena naprej",s:"Na stolu ali stolčku",
  how:["Sede na sprednji rob stolčka, hrbet raven.","Nagni se rahlo naprej proti kameri.","Podlakti na kolena, roke mehke."],
  say:"»Nagni se proti meni, kot da mi boš povedala skrivnost.«",tip:"Kamera malo nad višino oči.",
  fig:()=>[{prop:PROP.stool(96,150)},SIT(96,146,{to:-70,hd:-10,hair:"long",la:[55,10],ra:[60,5]})]},
 {id:"z4",k:"zenska",n:"Ob steni",s:"Naslonjena z ramo",
  how:["Z ramo se nasloni na steno, telo pod kotom.","Noge prekriži v gležnjih.","Roka ob steni ali v žepu."],
  say:"»Nasloni se, kot da nekoga čakaš.«",tip:"Stena daje oporo in sprosti držo.",
  fig:()=>[{prop:PROP.wall(52)},ST(92,{to:-82,hd:-6,hair:"long",tw:.8,la:[150,110],ll:[96,84],rl:[80,98],front:"R"})]},
 {id:"z5",k:"zenska",n:"Pogled čez ramo",s:"Hrbet proti kameri",
  how:["Obrni se s hrbtom proti kameri.","Glavo obrni čez ramo nazaj.","Rame spusti, brada proti rami."],
  say:"»Hodi stran od mene in se na moj znak ozri.«",tip:"Lepo s tančico, obleko z odprtim hrbtom ali lasmi.",
  fig:()=>[ST(100,{to:-90,hd:18,hair:"long",tw:.85,la:[105,95],ra:[75,88]})]},
 // ---- moški

const SOURCES=[
 ["Digital Photography School: 5 hitrih nasvetov za poziranje","https://digital-photography-school.com/5-quick-portrait-posing-tips-to-flatter-your-subject/"],
 ["Digital Photography School: 6 nasvetov za roke","https://digital-photography-school.com/6-tips-posing-hands-wedding-portrait-photography/"],

 ["Digital Photography School: skupinski portreti","https://digital-photography-school.com/pose-people-group-portraits/"],
 ["Digital Photography School: »gentle posing« prompti","https://digital-photography-school.com/tips-gentle-posing-prompts-get-started/"],
 ["Digital Photography School: okenska svetloba","https://digital-photography-school.com/portraits-with-window-light/"],
 ["Digital Photography School: 5 mest za naravno svetlobo","https://digital-photography-school.com/five-places-perfect-natural-portrait-lighting/"],

 ["Shotkit: boudoir poze","https://shotkit.com/boudoir-poses/"],
 ["Unsplash: vodnik po kompoziciji","https://help.unsplash.com/en/articles/7897234-photography-composition-guide"]
];

// ================= Stanje =================
const LS="kader-state-v1";
const lsx={get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const clone=o=>JSON.parse(JSON.stringify(o));
const S={view:"tips",tcat:"svetloba",pcat:"zenska",open:null,store:"",daily:Math.floor(Date.now()/864e5)%TIPS.length,msg:"",
  data:Object.assign({v:1,fav:[],done:{}},lsx.get(LS)||{})};
let docRef=null,writing=false,dirty=false;
async function flush(){if(!docRef)return;dirty=true;if(writing)return;writing=true;
  while(dirty){dirty=false;try{await docRef.set(clone(S.data));}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800));try{await docRef.set(clone(S.data));}catch(e2){}}else{docRef=null;S.store="local";}}}
  writing=false;}
function save(){lsx.set(LS,S.data);flush();}
(async function(){try{
  if(STANDALONE||!window.claude||!window.claude.use){S.store="local";renderTop();return;}
  const db=await window.claude.use("db");if(!db){S.store="local";renderTop();return;}
  docRef=db.doc("app/state");S.store="cloud";
  docRef.onSnapshot(s=>{if(writing||dirty||(s.metadata&&s.metadata.hasPendingWrites))return;
    if(s.exists){const d=s.data();if(d&&d.v){S.data=Object.assign({v:1,fav:[],done:{}},clone(d));lsx.set(LS,S.data);render();}}
    else if(S.data.fav.length)flush();renderTop();},()=>{docRef=null;S.store="local";renderTop();});
  renderTop();}catch(e){S.store="local";renderTop();}})();

// ================= Izris =================
function renderTop(){const el=document.getElementById("storeLbl");if(el)el.textContent=STANDALONE?"Shranjeno v telefonu":S.store==="cloud"?"Shranjeno v oblaku":S.store==="local"?"Samo na tej napravi":"";}
function render(){
  const nf=S.data.fav.length;
  const tabs=[["tips","Nasveti"],["poses","Poze"],["list","Moj seznam"+(nf?` (${nf})`:"")]];
  let h=`<div class="top"><div class="brand"><span class="rec" aria-hidden="true"></span>Kader</div><div class="store" id="storeLbl"></div></div>
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button type="button" role="tab" aria-selected="${S.view===k}" data-act="tab" data-v="${k}">${esc(l)}</button>`).join("")}</div>`;
  h+=S.view==="tips"?viewTips():S.view==="poses"?viewPoses():viewList();
  document.getElementById("app").innerHTML=h;renderTop();
}
const tipSvg=i=>i&&D[i]?`<svg viewBox="0 0 88 66" aria-hidden="true">${D[i]}</svg>`:"";
function viewTips(){
  const t=TIPS[S.daily];
  let h=`<h1>Za boljšo fotko</h1><p class="lede">Kratki nasveti o svetlobi, kompoziciji, nastavitvah in delu z ljudmi, zbrani iz fotografskih vodnikov.</p>
  <section class="daily" aria-live="polite"><small>Nasvet dneva · ${esc((TCATS.find(c=>c.k===t.k)||{}).n)}</small><b>${esc(t.t)}</b><span>${esc(t.d)}</span><button type="button" data-act="nexttip">Naslednji nasvet</button></section>
  <div class="chips" role="group" aria-label="Področja">${TCATS.map(c=>`<button type="button" aria-pressed="${S.tcat===c.k}" data-act="tcat" data-v="${c.k}">${esc(c.n)}<span class="n">${TIPS.filter(x=>x.k===c.k).length}</span></button>`).join("")}</div>
  <div class="tips">${TIPS.filter(x=>x.k===S.tcat).map(x=>`<article class="tip"><h3>${esc(x.t)}</h3>${tipSvg(x.i)}<p>${esc(x.d)}</p><div class="why"><b>Zakaj:</b> ${esc(x.w)}</div></article>`).join("")}</div>
  <h2 class="sec">Viri</h2><div class="src">${SOURCES.map(([n,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join("")}</div>`;
  return h;
}
function poseCard(p){const fav=S.data.fav.includes(p.id);
  return `<article class="pose"><div class="vf">${poseSvg(p)}<button type="button" class="star" aria-pressed="${fav}" aria-label="${fav?"Odstrani s seznama":"Dodaj na seznam"}" data-act="fav" data-v="${p.id}">${fav?"★":"☆"}</button></div>
   <button type="button" class="meta" style="border:0;background:transparent;text-align:left" data-act="open" data-v="${p.id}"><h3>${esc(p.n)}</h3><span class="s">${esc(p.s)}</span></button></article>`;}
function poseDetail(p){const fav=S.data.fav.includes(p.id);
  return `<article class="detail" id="det"><div class="vf">${poseSvg(p)}</div><div class="body"><h3>${esc(p.n)}</h3>
   <ol class="steps">${p.how.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
   <div class="say"><b>Reci jim</b>${esc(p.say)}</div><div class="ptip">${esc(p.tip)}</div>
   <div class="row"><button type="button" class="btn ${fav?"":"acc"}" data-act="fav" data-v="${p.id}">${fav?"★ Na seznamu":"☆ Dodaj na seznam"}</button><button type="button" class="btn" data-act="open" data-v="${p.id}">Zapri</button></div></div></article>`;}
function viewPoses(){
  const list=POSES.filter(p=>p.k===S.pcat);
  let h=`<h1>Poze</h1><p class="lede">Izberi vrsto fotografiranja. Klikni pozo za navodila, z zvezdico jo dodaš na svoj seznam za fotografiranje.</p>
  <div class="chips" role="group" aria-label="Vrsta fotografiranja">${CATS.map(c=>`<button type="button" aria-pressed="${S.pcat===c.k}" data-act="pcat" data-v="${c.k}">${esc(c.n)}<span class="n">${POSES.filter(x=>x.k===c.k).length}</span></button>`).join("")}</div>`;
  if(S.pcat==="boudoir")h+=`<div class="note"><b>Boudoir je zaupanje.</b> Pred fotografiranjem se pogovori o tem, kaj si stranka želi in česa ne. Začni oblečeno in s preprostimi pozami, nikoli ne pritiskaj na pozo, ki ji ni prijetna. Slike hrani zasebno in jih objavi samo s pisnim dovoljenjem.</div>`;
  h+=`<div class="poses">`;
  list.forEach(p=>{h+=S.open===p.id?poseDetail(p):poseCard(p);});
  return h+`</div>`;
}
function viewList(){
  const fav=S.data.fav.map(id=>POSES.find(p=>p.id===id)).filter(Boolean);
  let h=`<h1>Moj seznam</h1><p class="lede">Poze, ki si jih označil. Na fotografiranju jih odkljukaš, ko jih imaš.</p>`;
  if(!fav.length)return h+`<div class="empty">Seznam je prazen. V zavihku Poze pritisni zvezdico na pozah, ki jih želiš narediti na naslednjem fotografiranju.</div>`;
  const done=fav.filter(p=>S.data.done[p.id]).length;
  h+=`<div class="row" style="margin-top:12px;justify-content:space-between"><span class="lede">${done} od ${fav.length} narejenih</span><div class="row"><button type="button" class="btn" data-act="resetdone">Počisti kljukice</button><button type="button" class="btn" data-act="clearfav">Izprazni seznam</button></div></div><div class="list">`;
  fav.forEach(p=>{const d=!!S.data.done[p.id];
    h+=`<div class="li ${d?"done":""}">${poseSvg(p).replace("<svg ","<svg aria-hidden=\"true\" ")}<button type="button" style="border:0;background:transparent;text-align:left;padding:0" data-act="goto" data-v="${p.id}"><b>${esc(p.n)}</b><span>${esc((CATS.find(c=>c.k===p.k)||{}).n)} · ${esc(p.say)}</span></button><button type="button" class="chk" aria-pressed="${d}" aria-label="Narejeno" data-act="done" data-v="${p.id}">✓</button></div>`;});
  return h+`</div>${S.msg?`<div class="note">${esc(S.msg)}</div>`:""}`;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==="tab"){S.view=v;S.msg="";render();window.scrollTo(0,0);return;}
  if(a==="tcat"){S.tcat=v;render();return;}
  if(a==="pcat"){S.pcat=v;S.open=null;render();return;}
  if(a==="nexttip"){S.daily=(S.daily+1)%TIPS.length;render();return;}
  if(a==="open"){S.open=S.open===v?null:v;render();if(S.open){const d=document.getElementById("det");if(d)d.scrollIntoView({block:"nearest"});}return;}
  if(a==="fav"){const f=S.data.fav;S.data.fav=f.includes(v)?f.filter(x=>x!==v):f.concat(v);save();render();return;}
  if(a==="done"){S.data.done[v]=!S.data.done[v];save();render();return;}
  if(a==="resetdone"){S.data.done={};save();render();return;}
  if(a==="clearfav"){if(S.msg!=="Pritisni še enkrat za potrditev."){S.msg="Pritisni še enkrat za potrditev.";render();return;}S.data.fav=[];S.data.done={};S.msg="";save();render();return;}
  if(a==="goto"){const p=POSES.find(x=>x.id===v);if(p){S.view="poses";S.pcat=p.k;S.open=p.id;render();window.scrollTo(0,0);}return;}
});
if(STANDALONE&&"serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
})();
</script>
