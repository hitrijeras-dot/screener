<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EAX Vault</title>
<meta name="theme-color" content="#0c0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vault">
<style>
:root{--bg:#f3f4f8;--card:#fff;--card2:#f7f8fb;--ink:#14181f;--mut:#667085;--line:#e4e7ee;--long:#0b8a74;--longbg:#dff5ef;--short:#c4452f;--shortbg:#fbe6e1;--acc:#5b4ef0;--accbg:#ecebfe;--warn:#b7791f;--warnbg:#fdf3dc;--entry:#2c68d2;--grid:#eceef3;--sh:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);--glass:rgba(255,255,255,.85)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c0f14;--card:#151a22;--card2:#1b212b;--ink:#e8ebf0;--mut:#8a93a3;--line:#252c37;--long:#3fd1b3;--longbg:#12342d;--short:#ff7b63;--shortbg:#3a1d18;--acc:#8b80ff;--accbg:#231f45;--warn:#e8b04a;--warnbg:#33290f;--entry:#6f9bff;--grid:#1e242e;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--glass:rgba(21,26,34,.88)}}
:root[data-theme=dark]{--bg:#0c0f14;--card:#151a22;--card2:#1b212b;--ink:#e8ebf0;--mut:#8a93a3;--line:#252c37;--long:#3fd1b3;--longbg:#12342d;--short:#ff7b63;--shortbg:#3a1d18;--acc:#8b80ff;--accbg:#231f45;--warn:#e8b04a;--warnbg:#33290f;--entry:#6f9bff;--grid:#1e242e;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--glass:rgba(21,26,34,.88)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;margin:0}
button{font:inherit;color:var(--ink);cursor:pointer}
.top{position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 0 10px}
.in{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand b{font-size:17px;display:block;line-height:1.15}.brand small{color:var(--mut);font-size:12px}
.icb{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--sh)}
.w{max-width:1100px;margin:0 auto;padding:12px 16px 40px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.sec{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:16px 2px 8px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);text-align:left;width:100%}
.cd:active{transform:scale(.99)}
.r1{display:flex;align-items:center;gap:8px}.r1 .s{font-size:17px;font-weight:700}
.pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.L{background:var(--longbg);color:var(--long)}.S{background:var(--shortbg);color:var(--short)}
.gr{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.fe{background:var(--accbg);color:var(--acc)}
.px{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.r2{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-top:6px;gap:8px}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px;font-size:12px;font-variant-numeric:tabular-nums}
.lv div{background:var(--card2);border-radius:8px;padding:4px 6px}.lv span{display:block;color:var(--mut);font-size:10px}
.bar{height:5px;border-radius:3px;background:var(--card2);margin-top:8px;overflow:hidden;position:relative}.bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.empty{color:var(--mut);padding:30px 0;text-align:center}
#det{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none}
#det.on{display:block}
.tfs{display:flex;gap:6px;margin:10px 0}
.tf{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 11px;font-size:13px}.tf.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
#ch{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh);height:min(62vh,520px);min-height:320px;position:relative}
#ch iframe{width:100%;height:100%;border:0;display:block}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);margin:8px 2px 0}.leg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
#ch svg{display:block;width:100%}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}.kv span{display:block;font-size:11px;color:var(--mut)}.kv b{font-size:14px;font-variant-numeric:tabular-nums}
.links{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.links a{flex:1;text-align:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:600}
.note{font-size:12px;color:var(--mut);margin-top:10px}
.stale{color:var(--warn)}
.res{display:flex;align-items:baseline;gap:10px;margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--card2)}
.res b{font-size:20px;font-variant-numeric:tabular-nums}.res span{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.pos{color:var(--long)}.neg{color:var(--short)}
.rsi{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}.rsi span{font-size:11px;padding:2px 6px;border-radius:6px;background:var(--card2);color:var(--mut);font-variant-numeric:tabular-nums}
.rsi .hi{background:var(--shortbg);color:var(--short)}.rsi .lo{background:var(--longbg);color:var(--long)}
.meta{font-size:12px;color:var(--mut);margin-top:6px}.meta b{color:var(--ink);font-weight:600}
.stg{display:flex;gap:4px;margin-top:8px}.stg span{flex:1;text-align:center;font-size:11px;padding:3px 0;border-radius:6px;background:var(--card2);color:var(--mut)}.stg .on{background:var(--warnbg);color:var(--warn);font-weight:700}
.sm{display:block;font-size:10px;color:var(--warn)}
.stats{font-size:12px;color:var(--mut);margin:2px 2px 0}
</style>
</head>
<body>
<div class="top"><div class="in">
 <div class="brand"><b>EAX Vault</b><small id="upd">nalagam …</small></div>
 <div style="display:flex;gap:6px"><button class="icb" id="rk" aria-label="Riziko" style="width:auto;padding:0 10px">10 $</button><button class="icb" id="rf" aria-label="Osveži">↻</button><button class="icb" id="th" aria-label="Tema">◐</button></div>
</div></div>
<div class="w">
 <div class="stats" id="stats"></div>
 <div class="chips" id="flt" style="margin-top:10px"></div>
 <div id="list"></div>
</div>
<div id="det">
 <div class="top"><div class="in">
  <button class="icb" id="bk" aria-label="Nazaj">←</button>
  <div class="brand" style="flex:1"><b id="dt"></b><small id="ds"></small></div>
  <div class="px" id="dp" style="font-size:16px"></div>
 </div></div>
 <div class="w">
  <div class="tfs" id="tfs"></div>
  <div id="ch"></div>
  <div class="leg" id="leg"></div>
  <div id="dres"></div>
  <div class="kv" id="kv"></div>
  <div class="links" id="lk"></div>
  <div class="note">Sveče v živo z Bybita. Kartice zapiše Claude iz EAX Secret Vaulta vsakih 5 min. Ni finančni nasvet.</div>
 </div>
</div>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const $=s=>document.querySelector(s);
const API='https://api.bybit.com/v5/market/';
const TFS=[['5','5m'],['15','15m'],['30','30m'],['60','1H'],['240','4H'],['tv','TV ↗']];let CH=null,SER=null,CHsym='';
let RISK=+(localStorage.getItem('vault_risk')||10),V={cards:[]},PX={},F=localStorage.getItem('vault_f')||'all',TF=localStorage.getItem('vault_tf')||'15',cur=null,K=[];
try{const t=localStorage.getItem('vault_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=v=>{if(v==null||isNaN(v))return '–';const a=Math.abs(v);return a>=100?v.toFixed(2):a>=1?v.toFixed(3):a>=0.01?v.toFixed(5):v.toFixed(6)};
const hm=d=>d.toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit'});
const dhm=d=>{const t=new Date();return (d.toDateString()===t.toDateString()?'danes ':d.getDate()+'. '+(d.getMonth()+1)+'. ')+hm(d)};
const SEC={'IN PLAY':'V igri','PRIMED':'Primed','DEVELOPING':'Developing'};
const isL=c=>/LONG/.test(c.dir);
async function loadVault(){
 try{const r=await fetch('vault.json?'+Date.now(),{cache:'no-store'});V=await r.json();
  const u=new Date(V.updated),age=(Date.now()-u)/60000;
  $('#upd').innerHTML='Vault '+dhm(u)+(age>20?' <span class="stale">· zastarelo</span>':'')+' · '+V.cards.length+' kartic';
 }catch(e){$('#upd').textContent='vault.json ni dosegljiv'}
 const hd=V.head||'',m=k=>(hd.match(new RegExp('(\\d+) '+k))||[])[1];$('#stats').innerHTML=[m('scanned')&&m('scanned')+' pregledanih',m('anchored')&&m('anchored')+' anchored',V.live,V.closed&&'zaprtih 24h: '+V.closed.n+' ('+V.closed.r+')'].filter(Boolean).join(' · ');
 render();if(cur)openCard(cur.sym,true);
}
async function loadPx(){
 try{const r=await (await fetch(API+'tickers?category=linear')).json();PX={};r.result.list.forEach(t=>PX[t.symbol]=+t.lastPrice);
  if(!document.querySelector('.cd:active'))render();
  if(cur){const p=PX[cur.sym+'USDT'];if(p)$('#dp').textContent=fmt(p);const g=prog(cur),r=$('#dres');if(r)r.innerHTML=resHtml(g)}
 }catch(e){}
}
function prog(c){const p=PX[c.sym+'USDT']||c.px;if(!c.entry||!p)return null;const e=c.entry,s=c.stop,t=c.tp1;
 const r=isL(c)?(p-e)/(e-s):(e-p)/(s-e);const pct=(isL(c)?(p-e):(e-p))/e*100;return {r,pct,usd:r*RISK,toTp:Math.max(-1,Math.min(1,(p-e)/(t-e)))}}
const sg=v=>(v>=0?'+':'')+v;
function resHtml(g){if(!g)return '';const cl=g.r>=0?'pos':'neg';return `<div class="res" data-res><b class="${cl}">${sg(g.r.toFixed(2))}R</b><span class="${cl}">${sg(g.pct.toFixed(2))} %</span><span class="${cl}">${sg(g.usd.toFixed(2))} $</span><span style="margin-left:auto">pri ${RISK} $</span></div>`}
function rsiHtml(R){R=R||{};return '<div class="rsi">'+['1H','4H','12H','D','W'].filter(k=>R[k]!=null).map(k=>`<span class="${R[k]>=70?'hi':R[k]<=30?'lo':''}">${k} ${R[k]}</span>`).join('')+'</div>'}
function stgHtml(c){if(!c.stage||!c.stage.length)return '';const on=c.sec==='PRIMED'?'PRIMED':'FORMING';return '<div class="stg">'+c.stage.map(x=>`<span class="${x===on?'on':''}">${x}</span>`).join('')+'</div>'}
function chips(){const opts=[['all','Vse'],['fe','★ First entry'],['IN PLAY','V igri'],['PRIMED','Primed'],['DEVELOPING','Developing']];
 $('#flt').innerHTML=opts.map(([k,l])=>{const n=k==='all'?V.cards.length:k==='fe'?V.cards.filter(c=>c.type==='FIRST ENTRY').length:V.cards.filter(c=>c.sec===k).length;return `<button class="chip ${F===k?'on':''}" data-f="${k}">${l} ${n}</button>`}).join('')}
function card(c){const L=isL(c),p=PX[c.sym+'USDT']||c.px,g=prog(c);
 let h=`<button class="cd" data-s="${c.sym}"><div class="r1"><span class="s">${c.sym}</span><span class="pill ${L?'L':'S'}">${L?'LONG ↑':'SHORT ↓'}</span><span class="pill gr">${c.grade}</span>${c.type==='FIRST ENTRY'?'<span class="pill fe">★ first</span>':c.type?'<span class="pill gr">re-enter</span>':''}${(c.badges||[]).map(b=>`<span class="pill gr">${b.toLowerCase()}</span>`).join('')}<span class="px" data-px="${c.sym}">${fmt(p)}</span></div>`;
 h+=`<div class="r2"><span>${c.firedAt?dhm(new Date(c.firedAt)):c.time}${c.run?' · '+c.run.replace('running','teče'):''}</span><span>${c.chg?c.chg+' · ':''}${c.off||''}</span></div>`;
 if(c.entry){h+=resHtml(g)+`<div class="lv"><div><span>Vstop</span>${fmt(c.entry)}${c.entryNote?`<span class="sm">${c.entryNote.replace(/ · chasing/,'')}</span>`:''}</div><div><span>SL · ${(c.risk||'').replace(' risk','')}</span>${fmt(c.stop)}</div><div><span>TP1 · ${c.tp1r||''} · ${c.tp1pct||''}</span>${fmt(c.tp1)}</div></div>`;
  if(g){const w=Math.abs(g.toTp)*50,col=g.toTp>=0?'var(--long)':'var(--short)';h+=`<div class="bar"><i style="left:${g.toTp>=0?50:50-w}%;width:${w}%;background:${col}"></i><i style="left:50%;width:2px;background:var(--mut)"></i></div><div class="r2"><span>SL</span><span>vstop</span><span>TP1</span></div>`}
  h+=`<div class="meta">TP2 ${c.tp2r||''} <b>${fmt(c.tp2)}</b> (${c.tp2pct||''}) · od tu <b>${c.fromHere||'–'}</b>${c.fromNote?' · '+c.fromNote:''}</div>`;
 }else h+=stgHtml(c)+(c.stageNote?`<div class="meta">${c.stageNote}</div>`:'');
 h+=rsiHtml(c.rsi)+`<div class="meta">${c.sr?c.sr+' · ':''}${(c.triggers||[]).join(' + ')} · <b>${c.trigState||''}</b>${c.watch?' · na watchlisti':''}</div>`;
 return h+'</button>'}
function render(){chips();let cs=V.cards;if(F==='fe')cs=cs.filter(c=>c.type==='FIRST ENTRY');else if(F!=='all')cs=cs.filter(c=>c.sec===F);
 if(!cs.length){$('#list').innerHTML='<div class="empty">Ni kartic.</div>';return}
 let h='';['IN PLAY','PRIMED','DEVELOPING'].forEach(s=>{const g=cs.filter(c=>c.sec===s);if(!g.length)return;h+=`<div class="sec"><span>${SEC[s]}</span><span>${g.length}</span></div><div class="grid">${g.map(card).join('')}</div>`});
 $('#list').innerHTML=h}
$('#flt').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;F=b.dataset.f;try{localStorage.setItem('vault_f',F)}catch(e){};render()};
$('#list').onclick=e=>{const b=e.target.closest('[data-s]');if(b){location.hash=b.dataset.s}};
$('#bk').onclick=()=>{history.length>1?history.back():location.hash=''};
$('#rk').textContent=RISK+' $';$('#rk').onclick=()=>{const v=prompt('Riziko na trejd v $',RISK);if(v&&+v>0){RISK=+v;try{localStorage.setItem('vault_risk',RISK)}catch(e){};$('#rk').textContent=RISK+' $';render();if(cur)$('#dres').innerHTML=resHtml(prog(cur))}};
$('#rf').onclick=()=>{loadVault();loadPx()};
$('#th').onclick=()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=cur==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('vault_theme',n)}catch(e){};if(cur){killChart();CHsym='';loadK()}};
window.addEventListener('hashchange',route);
function route(){const s=decodeURIComponent(location.hash.slice(1));if(s)openCard(s);else{cur=null;killChart();CHsym='';$('#det').classList.remove('on');document.body.style.overflow=''}}
async function openCard(sym,keep){const c=V.cards.find(x=>x.sym===sym);if(!c){if(V.cards.length)location.hash='';return}
 cur=c;$('#det').classList.add('on');document.body.style.overflow='hidden';
 const L=isL(c);$('#dt').innerHTML=`${c.sym} <span class="pill ${L?'L':'S'}">${L?'LONG ↑':'SHORT ↓'}</span> <span class="pill gr">${c.grade}</span>`;
 $('#ds').textContent=[SEC[c.sec],c.type==='FIRST ENTRY'?'★ first entry':c.type?'re-enter':'',c.firedAt?dhm(new Date(c.firedAt)):''].filter(Boolean).join(' · ');
 $('#dp').textContent=fmt(PX[c.sym+'USDT']||c.px);
 $('#tfs').innerHTML=TFS.map(([k,l])=>`<button class="tf ${TF===k?'on':''}" data-t="${k}">${l}</button>`).join('');
 const k=[];if(c.entry){k.push(['Vstop',fmt(c.entry)+(c.entryNote?' · '+c.entryNote:'')],['SL',fmt(c.stop)+(c.risk?' · '+c.risk:'')],['TP1 · '+(c.tp1r||''),fmt(c.tp1)+' ('+(c.tp1pct||'')+')'],['TP2 · '+(c.tp2r||''),fmt(c.tp2)+' ('+(c.tp2pct||'')+')'],['Od tu',(c.fromHere||'–')+(c.fromNote?' · '+c.fromNote:'')],['Vault stanje',c.r||'–'],['Teče',c.run||'–'])}else k.push(['Faza',(c.stage||[]).join(' → ')||SEC[c.sec]],['Opomba',c.stageNote||'–']);
 const R=c.rsi||{};k.push(['RSI 1H/4H/12H/D/W',['1H','4H','12H','D','W'].map(x=>R[x]!=null?R[x]:'–').join(' / ')],['S/R',c.sr||'–'],['Triggerji',(c.triggers||[]).join(' + ')+' · '+(c.trigState||'')],['Od ekstrema',c.off||'–'],['Sprememba 24h',c.chg||'–']);
 $('#dres').innerHTML=resHtml(prog(c));
 $('#kv').innerHTML=k.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('');
 $('#lk').innerHTML=`<a href="https://www.tradingview.com/chart/?symbol=BYBIT:${c.sym}USDT.P" target="_blank" rel="noopener">TradingView</a><a href="https://www.bybit.com/trade/usdt/${c.sym}USDT" target="_blank" rel="noopener">Bybit</a>`;
 if(!keep){K=[];killChart();CHsym=''}await loadK();}
$('#tfs').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;TF=b.dataset.t;try{localStorage.setItem('vault_tf',TF)}catch(e){};document.querySelectorAll('.tf').forEach(x=>x.classList.toggle('on',x.dataset.t===TF));K=[];killChart();CHsym='';loadK()};
const TZ=-new Date().getTimezoneOffset()*60;
const dec=v=>{const a=Math.abs(v);return a>=100?2:a>=1?3:a>=0.01?5:6};
function killChart(){if(CH){try{CH.remove()}catch(e){}CH=null;SER=null}}
function tvEmbed(){killChart();CHsym='';const c=cur,th=(document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
 $('#ch').innerHTML=`<iframe src="https://s.tradingview.com/widgetembed/?symbol=BYBIT%3A${c.sym}USDT.P&interval=15&theme=${th}&style=1&timezone=Europe%2FLjubljana&locale=sl&hidesidetoolbar=0&saveimage=0&withdateranges=1" allowfullscreen></iframe>`;
 $('#leg').innerHTML='Pravi TradingView graf (BYBIT perp). Nivojev kartice tukaj ni – za vstop/SL/TP izberi 5m–4H.'}
async function loadK(){if(!cur)return;if(TF==='tv'){tvEmbed();return}const sym=cur.sym,tf=TF;
 try{const r=await (await fetch(`${API}kline?category=linear&symbol=${sym}USDT&interval=${tf}&limit=600`)).json();if(!cur||cur.sym!==sym||TF!==tf)return;
  K=r.result.list.reverse().map(k=>[+k[0],+k[1],+k[2],+k[3],+k[4]]);draw(sym+tf)}catch(e){killChart();$('#ch').innerHTML='<div class="empty">Sveč ni bilo mogoče naložiti.</div>'}}
function draw(key){const c=cur;if(!c||!K.length||TF==='tv')return;
 const data=K.map(k=>({time:k[0]/1000+TZ,open:k[1],high:k[2],low:k[3],close:k[4]}));
 if(CH&&CHsym===key){data.slice(-3).forEach(d=>SER.update(d));return}
 killChart();$('#ch').innerHTML='';CHsym=key;
 const up=css('--long'),dn=css('--short'),ink=css('--ink'),mut=css('--mut'),grid=css('--grid'),bg=css('--card'),ent=css('--entry'),warn=css('--warn');
 const p=dec(c.entry||K[K.length-1][4]);
 CH=LightweightCharts.createChart($('#ch'),{autoSize:true,layout:{background:{type:'solid',color:bg},textColor:mut,fontSize:11},grid:{vertLines:{color:grid},horzLines:{color:grid}},
  rightPriceScale:{borderColor:grid,scaleMargins:{top:.08,bottom:.08}},timeScale:{borderColor:grid,timeVisible:true,secondsVisible:false,rightOffset:6},
  crosshair:{mode:LightweightCharts.CrosshairMode.Normal},localization:{locale:'sl-SI',priceFormatter:v=>v.toFixed(p)},handleScroll:true,handleScale:true});
