<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EAX Vault</title>
<meta name="theme-color" content="#0a0a0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vault">
<style>
:root{--bg:#0a0a0b;--p1:#121214;--p2:#18181b;--p3:#202024;--line:#26262b;--line2:#34343a;--ink:#f2f2f3;--mut:#8b8b94;--dim:#5d5d66;--acc:#4ade80;--accd:rgba(74,222,128,.12);--long:#4ade80;--longd:rgba(74,222,128,.12);--short:#f0525a;--shortd:rgba(240,82,90,.13);--amb:#f5b041;--ambd:rgba(245,176,65,.13);--blue:#60a5fa;--blued:rgba(96,165,250,.13);--pur:#c084fc;--purd:rgba(192,132,252,.13);--gold:#facc15;--goldd:rgba(250,204,21,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,system-ui,"Inter","Segoe UI",Roboto,sans-serif;margin:0}
button,select{font:inherit;color:var(--ink);cursor:pointer}
.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.top{position:sticky;top:0;z-index:30;background:rgba(10,10,11,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 0 10px}
.in{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:900;font-size:22px;letter-spacing:.5px;line-height:1}.logo i{font-style:normal;color:var(--acc);text-shadow:0 0 14px rgba(74,222,128,.7)}
.logo small{font-size:11px;font-weight:600;letter-spacing:1.5px;color:var(--mut);margin-left:6px}
.upd{font-size:11px;color:var(--mut);margin-top:4px}.upd .bar{display:inline-block;width:70px;height:3px;background:var(--line);border-radius:2px;vertical-align:middle;margin-right:6px;overflow:hidden;position:relative}.upd .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);margin-right:5px;vertical-align:1px;animation:pl 2s infinite}@keyframes pl{50%{opacity:.35}}
.btns{display:flex;gap:6px}
.icb{height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line2);background:var(--p1);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600}
.w{max-width:1240px;margin:0 auto;padding:12px 16px 40px}
.eng{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.eng b{color:var(--ink)}.eng .t{color:var(--acc);font-weight:700;letter-spacing:.5px;margin-right:6px}
.eng span.k{background:var(--p1);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.ctl{display:flex;gap:8px;align-items:center;margin:12px 0 4px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:var(--p1);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--mut)}
.chip.on{color:var(--acc);border-color:var(--acc);background:var(--accd)}
.sort{background:var(--p1);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;font-size:12px}
.sec{font-size:11px;font-weight:800;letter-spacing:1.4px;margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.sec small{color:var(--mut);font-weight:500;letter-spacing:0;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:10px}
.cd{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:12px 13px;text-align:left;width:100%;position:relative;overflow:hidden}
.cd:hover{border-color:var(--line2)}.cd:active{transform:scale(.995)}
.cd.L{box-shadow:inset 3px 0 0 var(--long)}.cd.S{box-shadow:inset 3px 0 0 var(--short)}
.h1{display:flex;align-items:flex-start;gap:8px}.h1 .s{font-size:18px;font-weight:800;letter-spacing:.3px}
.h1 .pr{margin-left:auto;text-align:right}.h1 .pr b{display:block;font-size:15px}.h1 .pr span{font-size:11px}
.bd{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.b{font-size:10px;font-weight:800;letter-spacing:.6px;padding:2px 6px;border-radius:5px;border:1px solid transparent;text-transform:uppercase}
.bL{color:var(--long);background:var(--longd)}.bS{color:var(--short);background:var(--shortd)}
.bIP{color:var(--acc);border-color:rgba(74,222,128,.35)}.bPR{color:var(--amb);border-color:rgba(245,176,65,.4)}.bDV{color:var(--blue);border-color:rgba(96,165,250,.4)}
.gS{color:var(--gold);background:var(--goldd)}.gA{color:var(--long);background:var(--longd)}.gB{color:var(--blue);background:var(--blued)}.gC{color:var(--mut);background:var(--p3)}
.bFE{color:var(--pur);background:var(--purd)}.bRE{color:var(--mut);background:var(--p3)}.bX{color:var(--amb);background:var(--ambd)}
.tm{font-size:11px;color:var(--mut);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.res{display:flex;align-items:center;gap:10px;margin-top:9px;padding:8px 10px;border-radius:10px;background:var(--p2);border:1px solid var(--line)}
.res b{font-size:20px}.res span{font-size:12px;color:var(--mut)}
.pos{color:var(--long)!important}.neg{color:var(--short)!important}
.track{position:relative;height:6px;border-radius:3px;margin:16px 4px 4px;background:linear-gradient(90deg,var(--shortd) 0 var(--e),var(--longd) var(--e) 100%)}
.track.S{background:linear-gradient(90deg,var(--longd) 0 var(--e),var(--shortd) var(--e) 100%)}
.track .m{position:absolute;top:-4px;width:3px;height:14px;border-radius:2px;background:var(--ink);transform:translateX(-50%);box-shadow:0 0 8px rgba(255,255,255,.6)}
.track .e{position:absolute;top:-3px;width:2px;height:12px;background:var(--blue);transform:translateX(-50%)}
.tl{display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;letter-spacing:.6px;color:var(--dim)}
.box3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.box3>div{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:5px 7px;min-width:0}
.lab{display:block;font-size:9.5px;font-weight:700;letter-spacing:.7px;color:var(--dim);text-transform:uppercase}
.box3 b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.box3 small{display:block;font-size:10px;color:var(--mut)}
.row{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;align-items:center}
.rs{font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--p2);color:var(--mut);border:1px solid var(--line)}
.rs.hi{color:var(--short);background:var(--shortd);border-color:transparent}.rs.lo{color:var(--long);background:var(--longd);border-color:transparent}
.tg{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--p2);border:1px solid var(--line);color:var(--ink)}
.tg.live{color:var(--acc);border-color:rgba(74,222,128,.4)}.tg.wait{color:var(--amb);border-color:rgba(245,176,65,.4)}
.mini{font-size:11px;color:var(--mut);margin-top:7px;line-height:1.5}.mini b{color:var(--ink);font-weight:600}
.stg{display:flex;gap:4px;margin-top:9px}.stg span{flex:1;text-align:center;font-size:10px;font-weight:800;letter-spacing:.8px;padding:4px 0;border-radius:6px;background:var(--p2);color:var(--dim);border:1px solid var(--line)}.stg .on{background:var(--ambd);color:var(--amb);border-color:rgba(245,176,65,.45)}
.empty{color:var(--mut);padding:30px 0;text-align:center}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--p1)}
table{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
th{position:sticky;top:0;background:var(--p2);color:var(--mut);font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;text-align:right;padding:8px 9px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1}
th.on{color:var(--acc)}
td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:right;background:var(--p1)}
tr:hover td{background:var(--p2);cursor:pointer}
td .s{font-weight:800}
#det{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none}#det.on{display:block}
.tfs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tf{border:1px solid var(--line2);background:var(--p1);border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--mut)}.tf.on{color:var(--acc);border-color:var(--acc);background:var(--accd)}
#ch{background:var(--p1);border:1px solid var(--line);border-radius:14px;overflow:hidden;height:min(60vh,520px);min-height:320px;position:relative}
#ch iframe{width:100%;height:100%;border:0;display:block}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--mut);margin:8px 2px 0}.leg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.dg>div{background:var(--p1);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.dg b{font-size:14px;display:block;margin-top:2px}.dg small{color:var(--mut);font-size:11px}
.calc{background:var(--p1);border:1px solid rgba(74,222,128,.3);border-radius:12px;padding:10px 12px;margin-top:10px}
.calc h4{margin:0 0 6px;font-size:11px;letter-spacing:1.2px;color:var(--acc)}
.calc .dg>div{background:var(--p2)}
.links{display:flex;gap:8px;margin-top:12px}
.links a{flex:1;text-align:center;text-decoration:none;color:var(--ink);background:var(--p1);border:1px solid var(--line2);border-radius:10px;padding:10px;font-weight:700;font-size:13px}
.note{font-size:11px;color:var(--dim);margin-top:12px}
.stale{color:var(--amb)}
</style>
</head>
<body>
<div class="top"><div class="in">
 <div><div class="logo">EA<i>X</i><small>SECRET VAULT</small></div><div class="upd" id="upd">nalagam …</div></div>
 <div class="btns"><button class="icb" id="vw" title="Kartice / tabela">▦</button><button class="icb" id="rk" title="Riziko na trejd">10 $</button><button class="icb" id="rf" title="Osveži">↻</button></div>
</div></div>
<div class="w">
 <div class="eng" id="eng"></div>
 <div class="ctl"><div class="chips" id="flt"></div>
  <select class="sort" id="so"><option value="time">Najnovejše</option><option value="grade">Ocena</option><option value="r">Rezultat R</option><option value="dist">Najbližje vstopu</option><option value="sym">Abeceda</option></select></div>
 <div id="list"></div>
</div>
<div id="det">
 <div class="top"><div class="in">
  <button class="icb" id="bk" aria-label="Nazaj">←</button>
  <div style="flex:1;min-width:0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="logo" style="font-size:19px" id="dt"></span><span id="db" class="bd" style="margin:0"></span></div><div class="upd" id="ds"></div></div>
  <div style="text-align:right"><b class="n" id="dp" style="font-size:17px"></b><div class="n" id="dc" style="font-size:11px"></div></div>
 </div></div>
 <div class="w">
  <div class="tfs" id="tfs"></div>
  <div id="ch"></div>
  <div class="leg" id="leg"></div>
  <div id="dres"></div>
  <div class="calc" id="calc"></div>
  <div class="dg" id="kv"></div>
  <div class="links" id="lk"></div>
  <div class="note">Cene in sveče v živo z Bybita (cene vsakih 5 s, sveče vsakih 10 s). Kartice prepisuje Claude iz EAX Secret Vaulta vsakih 5 min, app jih preveri vsakih 30 s. Rezultat je izračunan iz kartice – app ni povezan s tvojim Bybit računom. Ni finančni nasvet.</div>
 </div>
</div>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const $=s=>document.querySelector(s);
const API='https://api.bybit.com/v5/market/';
const TFS=[['5','5m'],['15','15m'],['30','30m'],['60','1H'],['240','4H'],['tv','TV ↗']];
const ls=(k,d)=>{try{const v=localStorage.getItem('vault_'+k);return v==null?d:v}catch(e){return d}},ss=(k,v)=>{try{localStorage.setItem('vault_'+k,v)}catch(e){}};
let RISK=+ls('risk',10),VIEW=ls('view','cards'),F=ls('f','all'),SO=ls('so','time'),TF=ls('tf','15'),SK=ls('sk','r'),SD=+ls('sd',-1);
let V={cards:[]},TK={},INS={},cur=null,K=[],CH=null,SER=null,CHkey='',lastTk=0;
const FEE_M=.0002,FEE_T=.00055;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dec=v=>{const a=Math.abs(v);return a>=100?2:a>=1?3:a>=0.01?5:6};
const fmt=v=>v==null||isNaN(v)?'–':(+v).toFixed(dec(v));
const sg=(v,d)=>(v>=0?'+':'')+v.toFixed(d);
const hm=d=>d.toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit'});
const dhm=d=>{const t=new Date();return (d.toDateString()===t.toDateString()?'danes ':d.getDate()+'. '+(d.getMonth()+1)+'. ')+hm(d)};
const ago=d=>{const m=Math.round((Date.now()-d)/60000);return m<60?m+' min':m<1440?Math.floor(m/60)+'h '+(m%60)+'m':Math.floor(m/1440)+'d '+Math.floor(m%1440/60)+'h'};
const big=v=>v>=1e9?(v/1e9).toFixed(2)+' B':v>=1e6?(v/1e6).toFixed(1)+' M':v>=1e3?(v/1e3).toFixed(0)+' K':(+v).toFixed(0);
const isL=c=>/LONG/.test(c.dir);
const GR={S:4,A:3,B:2,C:1};
const SEC={'IN PLAY':['V IGRI','bIP','trejd je sprožen'],'PRIMED':['PRIMED','bPR','obrat se oblikuje, pripravi se'],'DEVELOPING':['DEVELOPING','bDV','izčrpan na ekstremu, obrata še ni']};
const px=c=>(TK[c.sym+'USDT']||{}).p||c.px;
function calc(c){const p=px(c);if(!c.entry||!p)return null;const e=c.entry,s=c.stop,t1=c.tp1,L=isL(c),risk=Math.abs(e-s);
 const r=(L?p-e:e-p)/risk,pct=(L?p-e:e-p)/e*100,dist=(p-e)/e*100,toTp=(p-e)/(t1-e);
 const qty=RISK/(risk+e*FEE_M+s*FEE_T),not=qty*e;
 const rr1=Math.abs(t1-e)/risk,rr2=c.tp2?Math.abs(c.tp2-e)/risk:null;
 const lo=Math.min(s,t1,p),hi=Math.max(s,t1,p),span=hi-lo||1,pos=v=>Math.max(0,Math.min(100,(v-lo)/span*100));
 let st,cl;const hitTp=L?p>=t1:p<=t1,hitSl=L?p<=s:p>=s,beyond=L?p<e:p>e,near=Math.abs(dist)<=.3;
 if(hitSl){st='SL dosežen';cl='bS'}else if(hitTp){st='TP1 dosežen';cl='bL'}else if(near){st='na vstopu';cl='bIP'}else if(beyond){st='v coni vstopa';cl='bX'}else if(toTp>=.7){st='blizu TP1';cl='bL'}else{st=(L?'nad':'pod')+' vstopom · čakaj povratek';cl='bRE'}
 return {p,r,pct,dist,toTp,usd:r*RISK,qty,not,rr1,rr2,st,cl,pE:pos(e),pP:pos(p),L}}
function stageOn(c){return c.sec==='PRIMED'?'PRIMED':'FORMING'}
async function loadVault(){
 try{const r=await fetch('vault.json?'+Date.now(),{cache:'no-store'});V=await r.json();
  const hd=V.head||'',m=k=>(hd.match(new RegExp('(\\d+) '+k))||[])[1];
  $('#eng').innerHTML=`<span class="t">REVERSAL ENGINE</span>`+[m('scanned')&&`<span class="k"><b>${m('scanned')}</b> pregledanih</span>`,m('anchored')&&`<span class="k"><b>${m('anchored')}</b> anchored</span>`,V.live&&`<span class="k">${V.live.replace('live','v igri').replace('closed 24h','zaprtih 24h')}</span>`,V.closed&&`<span class="k">zaprti 24h: ${V.closed.r.split('·').map(x=>`<b class="${/-/.test(x)?'neg':'pos'}">${x.trim()}</b>`).join(' · ')}</span>`].filter(Boolean).join('');
 }catch(e){}
 updLine();render();if(cur){const c=V.cards.find(x=>x.sym===cur.sym);if(c){cur=c;detailInfo()}}
}
function updLine(){if(!V.updated){$('#upd').textContent='vault.json ni dosegljiv';return}const u=new Date(V.updated),age=(Date.now()-u)/60000,live=Date.now()-lastTk<20000;
 $('#upd').innerHTML=`${live?'<span class="dot"></span>cene v živo · ':''}kartice ${hm(u)}${age>12?' · <span class="stale">zastarele ('+Math.round(age)+' min)</span>':' ('+Math.max(0,Math.round(age))+' min)'}`}
async function loadTk(){try{const r=await (await fetch(API+'tickers?category=linear',{cache:'no-store'})).json();TK={};r.result.list.forEach(t=>TK[t.symbol]={p:+t.lastPrice,ch:+t.price24hPcnt*100,to:+t.turnover24h,fr:+t.fundingRate*100,hi:+t.highPrice24h,lo:+t.lowPrice24h,nf:+t.nextFundingTime});
 lastTk=Date.now();updLine();if(!document.querySelector('#list :active'))render();if(cur)detailInfo()}catch(e){}}
async function loadIns(sym){if(INS[sym])return INS[sym];try{const r=await (await fetch(API+'instruments-info?category=linear&symbol='+sym+'USDT')).json();const i=r.result.list[0];INS[sym]={step:+i.lotSizeFilter.qtyStep,min:+i.lotSizeFilter.minOrderQty,tick:+i.priceFilter.tickSize,lev:+i.leverageFilter.maxLeverage}}catch(e){INS[sym]=null}return INS[sym]}
function filtered(){let cs=V.cards.slice();if(F==='fe')cs=cs.filter(c=>c.type==='FIRST ENTRY');else if(F!=='all')cs=cs.filter(c=>c.sec===F);
 const k={time:c=>-(new Date(c.firedAt||0)),grade:c=>-(GR[c.grade]||0),r:c=>{const g=calc(c);return g?-g.r:99},dist:c=>{const g=calc(c);return g?Math.abs(g.dist):99},sym:c=>c.sym}[SO];
 return cs.sort((a,b)=>{const x=k(a),y=k(b);return x<y?-1:x>y?1:0})}
function chips(){const opts=[['all','Vse'],['fe','★ First entry'],['IN PLAY','V igri'],['PRIMED','Primed'],['DEVELOPING','Developing']];
 $('#flt').innerHTML=opts.map(([k,l])=>{const n=k==='all'?V.cards.length:k==='fe'?V.cards.filter(c=>c.type==='FIRST ENTRY').length:V.cards.filter(c=>c.sec===k).length;return `<button class="chip ${F===k?'on':''}" data-f="${k}">${l} ${n}</button>`}).join('')}
function badges(c){const L=isL(c);return `<span class="b ${SEC[c.sec][1]}">${SEC[c.sec][0]}</span><span class="b ${L?'bL':'bS'}">${L?'LONG ↑':'SHORT ↓'}</span><span class="b g${c.grade}">${c.grade}-GRADE</span>`+(c.type==='FIRST ENTRY'?'<span class="b bFE">★ FIRST ENTRY</span>':c.type?'<span class="b bRE">RE-ENTER</span>':'')+(c.badges||[]).map(b=>`<span class="b bX">${b}</span>`).join('')}
function rsiRow(R){R=R||{};return ['1H','4H','12H','D','W'].filter(k=>R[k]!=null).map(k=>`<span class="rs ${R[k]>=70?'hi':R[k]<=30?'lo':''}">${k} <b class="n">${R[k]}</b></span>`).join('')}
function resBox(g){if(!g)return '';const cl=g.r>=0?'pos':'neg';return `<div class="res n"><b class="${cl}">${sg(g.r,2)}R</b><span class="${cl}">${sg(g.pct,2)} %</span><span class="${cl}">${sg(g.usd,2)} $</span><span style="margin-left:auto">pri ${RISK} $</span></div>`}
function card(c){const L=isL(c),g=calc(c),t=TK[c.sym+'USDT']||{};
 let h=`<button class="cd ${L?'L':'S'}" data-s="${c.sym}"><div class="h1"><span class="s">${c.sym}</span><div class="pr n"><b>${fmt(px(c))}</b><span class="${(t.ch!=null?t.ch:parseFloat(c.chg)||0)>=0?'pos':'neg'}">${t.ch!=null?sg(t.ch,2)+' %':c.chg}</span></div></div><div class="bd">${badges(c)}</div>`;
 h+=`<div class="tm"><span>${c.firedAt?dhm(new Date(c.firedAt)):c.time}${c.sec==='IN PLAY'&&c.firedAt?' · teče '+ago(new Date(c.firedAt)):''}</span><span>${c.off||''}</span></div>`;
 if(g){h+=`<div style="margin-top:8px"><span class="b ${g.cl}">${g.st}</span> <span class="mini n">od vstopa ${sg(g.dist,2)} %</span></div>`+resBox(g);
